<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جندي على الحدود الرقمية</title>
<style>html,body{margin:0;background:#000;height:100%}body{display:flex;align-items:center;justify-content:center}
canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;object-fit:contain;display:block}
#play{position:fixed;inset:0;margin:auto;width:110px;height:110px;border-radius:50%;border:2px solid #26e8a0;background:rgba(0,0,0,.5);color:#26e8a0;font-size:40px;cursor:pointer}
body.render #play{display:none}</style></head>
<body><canvas id="c"></canvas><button id="play">▶</button><audio id="a" src="audio_ep1.wav" preload="auto"></audio>
<script src="lib.js"></script><script src="scenes1.js"></script><script src="scenes2.js"></script><script src="scenes3.js"></script><script src="assets.js"></script><script src="scene7.js"></script><script src="engine.js"></script><script src="ep1.js"></script>
<script>
setup(document.getElementById('c'));
window.fontsReady=assetsReady;
const RENDER=location.search.includes('render');if(RENDER)document.body.classList.add('render');
window.frameAt=async(t)=>{await prepare(t);render(t);return cv.toDataURL('image/jpeg',.93);};
if(!RENDER){fontsReady.then(()=>render(0.01));const a=document.getElementById('a');let t0=null;
 document.getElementById('play').onclick=e=>{e.target.style.display='none';a.currentTime=0;a.play().catch(()=>{});t0=performance.now();requestAnimationFrame(loop);};
 function loop(){const t=a.paused||!a.duration?(performance.now()-t0)/1000:a.currentTime;const TT=Math.min(t,OUT_EP-.001),A=atEp(TT);if(A.n=='s7'&&Math.abs(VID.currentTime-A.t)>.12)VID.currentTime=A.t;render(TT);if(t<OUT_EP)requestAnimationFrame(loop);else document.getElementById('play').style.display='block';}}
</script></body></html>
