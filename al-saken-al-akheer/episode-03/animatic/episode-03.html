<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الساكن الأخير 03</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800;900&family=Tajawal:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;width:720px;height:1280px;overflow:hidden}
  #stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#000}
  .scene{position:absolute;inset:0;opacity:0}
  .scene>svg,.full{position:absolute;inset:0;width:720px;height:1280px;overflow:visible}
  .cctvLook{filter:grayscale(1) sepia(.35) hue-rotate(55deg) saturate(.9) contrast(1.15) brightness(1.05)}
  .sepia{filter:sepia(.85) contrast(.9) brightness(.85)}
  #caps{position:absolute;left:34px;right:34px;bottom:250px;text-align:center;font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:42px;line-height:1.55;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.95),0 0 26px rgba(0,0,0,.85)}
  #caps .y{color:#f0d58c} #caps .r{color:#d0473d} #caps .q{color:#f4ead4;font-weight:600}
  #grain{position:absolute;inset:-60px;opacity:.07;mix-blend-mode:screen;pointer-events:none}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at center,transparent 45%,rgba(0,0,0,.8) 100%),linear-gradient(to top,rgba(0,0,0,.55) 0,transparent 380px)}
  #black{position:absolute;inset:0;background:#000;opacity:0}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Kufi Arabic'}
  #title .a{font-size:74px;font-weight:900;color:#e8e8e8;opacity:0}
  #title .b{font-size:32px;font-weight:600;color:#8a8a8a;margin-top:26px;opacity:0}
  /* phone */
  .ph{position:absolute;width:340px;height:700px;border-radius:48px;background:#050607;border:3px solid #23292d;box-shadow:0 0 0 2px #0b0d0f,0 30px 80px rgba(0,0,0,.8),0 0 160px rgba(120,170,210,.16);overflow:hidden;font-family:'Tajawal',sans-serif;direction:rtl}
  .scr{position:absolute;inset:10px;border-radius:38px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#16222b 0%,#05080a 70%)}
  .ldate{position:absolute;top:90px;width:100%;text-align:center;font-size:24px;color:#cbd5da;font-weight:700}
  .ltime{position:absolute;top:120px;width:100%;text-align:center;font-size:120px;font-weight:300;color:#eef3f5;direction:ltr;letter-spacing:-3px}
  .feedIn{position:absolute;left:0;right:0;top:120px;height:430px;overflow:hidden;background:#000}
  /* plaque under photos */
  .plq{font-family:'Amiri',serif}
</style>
</head>

</svg>

function setT(el,s){if(el)el.setAttribute('transform',s)}
function cam(el,{x=0,y=0,s=1,r=0,ox=360,oy=640}){setT(el,`translate(${ox+x} ${oy+y}) rotate(${r}) scale(${s}) translate(${-ox} ${-oy})`)}
const blink=(t,period=4.2,off=0)=>{const p=((t+off)%period);return p<.14?Math.abs(p-.07)/.07:1};
const flick=(t,seed=1)=>{const v=Math.sin(t*37*seed)*Math.sin(t*11.3+seed)*Math.sin(t*3.1);return v>.55?.75:(v>.4?.3:0)};

function faceRig(root,{open=1,lookX=0,lookY=0,brow=0,mouth=0,phone=0,turn=0,breath=0,smile=0}){
  root.querySelectorAll('.lidL,.lidR').forEach(l=>l.setAttribute('height',(1-open)*50));
  root.querySelectorAll('.irisL,.irisR').forEach(g=>setT(g,`translate(${lookX*12} ${lookY*7})`));
  root.querySelectorAll('.browL,.browR').forEach(g=>setT(g,`translate(0 ${-brow*10})`));
  root.querySelector('.mouth').setAttribute('ry',mouth*10);
  root.querySelector('.mline').setAttribute('d',`M${328-smile*10} ${716-smile*10} Q362 ${709+smile*18} ${396+smile*10} ${716-smile*10}`);
  root.querySelector('.phoneLight').setAttribute('opacity',phone);
  setT(root.querySelector('.head'),`translate(${turn*14} ${breath*3}) rotate(${turn*2} 362 600)`);
}
function faceBg(which,{amb=.32,tint=0,red=0}={}){
  $('#s_face .bgRoom').setAttribute('opacity',which==='room'?.35:0);$('#s_face .bgElev').setAttribute('opacity',which==='elev'?1:0);$('#s_face .bgZero').setAttribute('opacity',which==='zero'?1:0);
  $$('#s_face .blueAmb').forEach(e=>e.setAttribute('opacity',amb));$('#s_face .tint').setAttribute('opacity',tint);$('#s_face .redLight').setAttribute('opacity',red);
}
// body rig: run cycle, back/front view, arm press
function bodyRig(g,{run=0,phase=0,back=0,press=0,shade=0,lookX=0}){
  const sw=Math.sin(phase)*run;
  setT(g.querySelector('.legL'),`rotate(${sw*28} -25 -250)`);setT(g.querySelector('.legR'),`rotate(${-sw*28} 25 -250)`);
  setT(g.querySelector('.armL'),`rotate(${-sw*30} -64 -440)`);setT(g.querySelector('.armR'),`rotate(${sw*30-press*120} 64 -440)`);
  g.querySelector('.bback').setAttribute('opacity',back);g.querySelector('.bface').setAttribute('opacity',1-back);
  g.querySelector('.hoodTie').setAttribute('opacity',1-back);
  g.querySelectorAll('.bi').forEach(e=>e.setAttribute('transform',`translate(${lookX*3} 0)`));
}
function place(g,x,y,s,bob=0){setT(g,`translate(${x} ${y-bob}) scale(${s})`)}
function dispNum(sel,v,color='#f0a640'){$$(sel).forEach(e=>{if(e.textContent!==v)e.textContent=v;e.setAttribute('fill',color)})}

// 58–60 — the phone says Wednesday… the photo says Thursday… tomorrow
S('s_phone',A(58),A(60),(l,t)=>{$('#feedIn').style.opacity=0;$('#lock').style.opacity=1;$('#s_phone .pcam').style.transform=`scale(${lerp(1.0,1.5,ease(ramp(l,0,A(60)-A(58))))}) translateY(${lerp(0,140,ease(ramp(l,0,A(60)-A(58))))}px)`});
S('s_photo',A(60),B(60)-.6,(l,t)=>{cam($('#s_photo .cam'),{s:2.6,oy:1045});plaque(1,1,1)});
S('s_face',B(60)-.6,A(61),(l,t)=>{faceBg('zero',{tint:.15});cam($('#s_face .cam'),{s:2.4,oy:568});faceRig($('#s_face'),{open:1,lookX:0,brow:1.1})});

S('s_zero',A(61),A(63),(l,t)=>{zeroCamBack(t);zeroFlick(t)});
S('s_hall',A(63),A(64),(l,t)=>{const g=$('#s_hall .nb');const k=ease(ramp(t,A(63),A(63)+.9));const close=ease(ramp(t,A(63),A(63)+.55));
  setT($('#s_hall .hDoorL'),`translate(${-(1-close)*56} 0)`);setT($('#s_hall .hDoorR'),`translate(${(1-close)*56} 0)`);dispNum('#s_hall .hNum','0','#d0362a');
  bodyRig(g,{run:1-ramp(t,A(63)+.6,A(63)+.9),phase:t*12,back:1});place(g,360,lerp(1100,900,k),lerp(.9,.5,k),Math.abs(Math.sin(t*12))*10*(1-k));
  cam($('#s_hall .cam'),{s:1.25,oy:720,y:t>A(63)+.55&&t<A(63)+.7?6:0});$('#s_hall .hLamp').setAttribute('opacity',.3);$('#s_hall').style.filter='sepia(.5) brightness(.75)'});
// 64 — the button doesn't respond
S('s_btn',A(64),A(65),(l,t)=>{const p=[.1,.45,.8,1.2,1.6].some(x=>l>x&&l<x+.15);setT($('#s_btn .finger'),`translate(${p?-14:0} ${p?-10:0})`);$('#s_btn .bLit').setAttribute('opacity',0);
  cam($('#s_btn .cam'),{s:1.05,ox:520,oy:600,x:(p?Math.sin(t*80)*3:0)})});
// 65–70 — footsteps from the apartment; static shot behind him, slow push into the dark
S('s_zero',A(65),A(71),(l,t)=>{const k=ease(ramp(t,A(67),A(71)));zeroCam(lerp(.1,.55,k));zNav({x:250,y:1300,s:1.3,back:1,op:1-ramp(t,A(69),A(70))});zeroFlick(t)});
// 71 — B-roll: trembling hands
S('s_hands',A(71),A(72)+.3,(l,t)=>{const tr=Math.sin(t*45)*2.5+Math.sin(t*31)*1.5;setT($('#s_hands .hl'),`translate(${tr} ${-tr*.4})`);setT($('#s_hands .hr'),`translate(${-tr} ${tr*.4})`);
  cam($('#s_hands .cam'),{s:1.05,oy:900,y:-ease(ramp(l,0,2))*120})});
// 72–73 — "don't run, Nawaf… you came back a day early" — tilt up to the face, recognition
S('s_face',A(72)+.3,A(74),(l,t)=>{faceBg('zero',{tint:.1});const k=ease(ramp(l,0,1.6));cam($('#s_face .cam'),{s:1.5,oy:lerp(800,580,k)});
  faceRig($('#s_face'),{open:lerp(1,.88,ramp(t,A(73),B(73))),lookX:.3,lookY:-.2,brow:lerp(.9,.5,ramp(t,A(73),B(73))),breath:Math.sin(t*7)*.5})});
// 74–76 — "…the voice was my father's": extreme close, then toward the dark door, a vague shadow, cut
S('s_face',A(74),B(76)+.5,(l,t)=>{faceBg('zero',{tint:.2});cam($('#s_face .cam'),{s:2.5,oy:568});faceRig($('#s_face'),{open:t>A(76)?1:.9,lookX:.2,brow:t>A(76)?1.2:.8,mouth:t>A(76)?.2:0})});
S('s_door0',B(76)+.5,END_CUT,(l,t)=>{setT($('#s_door0 .leaf'),'translate(-26 0)');const k=ease(ramp(t,B(76)+.5,END_CUT));cam($('#s_door0 .cam'),{s:1.1+k*.5,ox:220,oy:560});
  $('#s_door0 .shadowIn').setAttribute('opacity',ramp(t,B(76)+1.3,END_CUT-.3)*.8);$('#s_door0 .dLamp').setAttribute('opacity',.3)});

// ---------- helpers ----------
function roomState(root,{sit=0}){root.querySelectorAll('.sitN').forEach(e=>e.setAttribute('opacity',sit));root.querySelectorAll('.sitGlow').forEach(e=>e.setAttribute('opacity',0))}
function shaftMove(t,speed){const off=(t*speed)%180;setT($('#s_shaft .slits'),`translate(0 ${-off})`);setT($('#s_shaft .cableMarks'),`translate(0 ${-(t*speed)%90})`);setT($('#s_shaft .railBolts'),`translate(0 ${-(t*speed)%140})`)}
function elevDoors(open){setT($('#s_elev .doorL'),`translate(${-open*130} 0)`);setT($('#s_elev .doorR'),`translate(${open*130} 0)`)}
function elevNav(t,{lookUp=0}){const g=$('#s_elev .nb');bodyRig(g,{back:1});place(g,360,1250,1.12,Math.sin(t*2)*2);setT(g.querySelector('.bhead'),`translate(0 ${-lookUp*6}) rotate(0)`);
  $('#s_elev .flick').setAttribute('opacity',flick(t,1.7)*.35);$('#s_elev .ceil').setAttribute('opacity',1-flick(t,1.7)*.6)}
function zeroFlick(t,a='#s_zero .zL1',b='#s_zero .zL2'){const f=flick(t,2.3);$$(a).forEach(e=>e.setAttribute('opacity',.6-f*.55));$$(b).forEach(e=>e.setAttribute('opacity',.5-flick(t,3.1)*.4));
  const beam=$('#s_zero .zB1');if(beam)beam.setAttribute('opacity',.35-f*.3);const z=$('#s_zero .zFlick');if(z)z.setAttribute('opacity',f*.25);
  setT($('#s_zero .zFog'),`translate(${Math.sin(t*.2)*40} 0)`)}
function zeroCam(depth,{x=0,y=0,s=1}={}){ // depth 0..1 = dolly toward the far door, layered parallax
  setT($('#s_zero .zFar'),`translate(360 600) scale(${(1+depth*2.2)*s}) translate(${-360+x*.4} ${-600+y*.4})`);
  setT($('#s_zero .zMid'),`translate(360 600) scale(${(1+depth*1.4)*s}) translate(${-360+x} ${-600+y})`);
  setT($('#s_zero .zFog'),`translate(360 600) scale(${1+depth*1.9}) translate(-360 -600)`);setT($('#s_zero .zElev'),`translate(360 640) scale(${1+depth*.8}) translate(-360 -640)`)}
function zeroCamBack(t){ // tracking him running back to the elevator; doors close just before he reaches it
  const k=ease(ramp(t,A(61),A(63)+.4));zNav({x:360,y:lerp(1500,980,k),s:lerp(1.6,.6,k),back:1,op:1,run:1-ramp(t,A(63)+.3,A(63)+.6)});zeroCam(0,{});
  const g=$('#s_zero .zElev');g.setAttribute('opacity',0);
  setT($('#s_zero .zMid'),'translate(360 600) scale(1) translate(-360 -600) rotate(180 360 600)');setT($('#s_zero .zFar'),'translate(0 0)');
  // draw the elevator at the far end using the far group: reuse the door rect as closing elevator doors
  const close=ease(ramp(t,A(62)+.2,A(63)+.35));$('#s_zero .zDoor').setAttribute('fill','#4a5157');$('#s_zero .zDoor').setAttribute('width',40*close);$('#s_zero .zDoor').setAttribute('x',340+20*(1-close));
  cam($('#s_zero .cam'),{s:1.0,y:Math.sin(t*14)*3*(1-ramp(t,A(63)+.3,A(63)+.5)),oy:640});}
function zNav({x=360,y=1250,s=1.1,back=1,op=1,run=0,lookX=0}){const g=$('#s_zero .zNav .nb');g.setAttribute('opacity',op);bodyRig(g,{back,run,phase:performance.now?CUR*12:0,lookX});place(g,x,y,s,Math.abs(Math.sin(CUR*12))*run*12)}
function motes(t){$$('#s_dust .mote').forEach(m=>{const x=+m.dataset.x+Math.sin(t*.3*+m.dataset.s+ +m.dataset.y)*20,y=(+m.dataset.y-t*14*+m.dataset.s)%1280;m.setAttribute('cx',x);m.setAttribute('cy',y<0?y+1280:y)})}
function plaque(a=1,b=1,c=1){$('#s_photo .pl1').setAttribute('opacity',a);$('#s_photo .pl2').setAttribute('opacity',b);$('#s_photo .pl3').setAttribute('opacity',c);
  $('#s_photo .pl3').setAttribute('fill',c&&CUR>A(60)-.1?'#7a1a12':'#2a1e12')}

// ---------- captions ----------
const HL={23:'r',46:'y',52:'r',56:'y',57:'y',60:'r',76:'r',3:'y'};
const POP=new Set([23,52,60,76]);
const CAPS=[];
SEG.forEach((s,i)=>{const words=s.text.split(' ');const cls=HL[i]||'';
  const wrap=txt=>cls?`<span class="${cls}">${txt}</span>`:(txt.startsWith('«')||txt.endsWith('»')?`<span class="q">${txt}</span>`:txt);
  const nextA=i+1<SEG.length?SEG[i+1].a:s.b+1.2;const end=Math.min(nextA-.05,s.b+.55);
  if(words.length>6){let cut=words.findIndex(w=>w.endsWith('،')||w.endsWith('…'))+1;if(cut<=0||cut>=words.length)cut=Math.ceil(words.length/2);
    const p1=words.slice(0,cut).join(' '),p2=words.slice(cut).join(' ');const mid=s.a+(s.b-s.a)*(p1.length/(p1.length+p2.length));
    CAPS.push([s.a,mid,wrap(p1),i]);CAPS.push([mid,end,wrap(p2),i]);}else CAPS.push([s.a,end,wrap(s.text),i]);});
let lastCap=-1;
function caps(t){let k=-1;for(let j=0;j<CAPS.length;j++){if(t>=CAPS[j][0]&&t<CAPS[j][1])k=j}
  const el=$('#caps');if(k!==lastCap){el.innerHTML=k>=0?CAPS[k][2]:'';lastCap=k}
  if(k>=0){const e=eo(ramp(t,CAPS[k][0],CAPS[k][0]+.22));const pop=POP.has(CAPS[k][3]);el.style.opacity=e;el.style.transform=`scale(${pop?lerp(1.25,1.08,e):(.92+.08*e)})`}else el.style.opacity=0}

// ---------- grain ----------
const gc=$('#grain').getContext('2d');const NF=[];
(()=>{let s=31;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let f=0;f<6;f++){const im=gc.createImageData(420,700);for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}NF.push(im)}})();
$('#grain').style.width='840px';$('#grain').style.height='1400px';

let CUR=0;
function seek(t){CUR=t;
  let active=null;for(const s of TL){if(t>=s.a&&t<s.b)active=s}
  $$('.scene').forEach(e=>e.style.opacity=0);
  if(active){const el=document.getElementById(active.id);el.style.opacity=1;
    // reset shared state that some scenes change
    if(active.id==='s_zero'){$('#s_zero .zDoor').setAttribute('fill','#1e1710');$('#s_zero .zDoor').setAttribute('width',40);$('#s_zero .zDoor').setAttribute('x',340);cam($('#s_zero .cam'),{});$('#s_zero .zElev').setAttribute('opacity',0)}
    active.fn(t-active.a,t);}
  const flash=(t>A(4)-.25&&t<A(4)-.1);
  const blk=t>=END_CUT||flash;$('#black').style.opacity=blk?1:0;
  $('#title .a').style.opacity=Math.min(ramp(t,END_CUT+1.0,END_CUT+1.7),1-ramp(t,DURATION-.7,DURATION-.1));
  $('#title .b').style.opacity=Math.min(ramp(t,END_CUT+2.2,END_CUT+2.9),1-ramp(t,DURATION-.7,DURATION-.1));
  caps(t);$('#caps').style.visibility=t>=END_CUT?'hidden':'visible';
  const top=active&&active.id==='s_photo';$('#caps').style.bottom=top?'auto':'250px';$('#caps').style.top=top?'90px':'auto';
  const f=Math.floor(t*30)%6;gc.putImageData(NF[f],0,0);$('#grain').style.transform=`translate(${(f*37)%60}px,${(f*53)%60}px)`;
}
window.seek=seek;window.DURATION=DURATION;
if(!location.search.includes('render')){let t0=null;const loop=ts=>{if(t0===null)t0=ts;seek(((ts-t0)/1000)%DURATION);requestAnimationFrame(loop)};document.fonts.ready.then(()=>requestAnimationFrame(loop));}
else seek(0);
</script>
