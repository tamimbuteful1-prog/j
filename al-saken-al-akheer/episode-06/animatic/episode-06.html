<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الساكن الأخير 06</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800;900&family=Tajawal:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;width:720px;height:1280px;overflow:hidden}
  #stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#000}
  .scene{position:absolute;inset:0;opacity:0}
  .scene>svg{position:absolute;inset:0;width:720px;height:1280px;overflow:hidden}
  .vhs{filter:grayscale(.85) sepia(.3) contrast(1.15) brightness(.95) blur(.6px)}
  .cctv{filter:grayscale(1) sepia(.35) hue-rotate(55deg) saturate(.9) contrast(1.15)}
  #caps{position:absolute;left:34px;right:34px;bottom:250px;text-align:center;font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:42px;line-height:1.55;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.95),0 0 26px rgba(0,0,0,.85)}
  #caps .y{color:#f0d58c} #caps .r{color:#d0473d} #caps .q{color:#f4ead4;font-weight:600}
  #grain{position:absolute;inset:-60px;opacity:.06;mix-blend-mode:screen;pointer-events:none}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at center,transparent 45%,rgba(0,0,0,.78) 100%),linear-gradient(to top,rgba(0,0,0,.55) 0,transparent 380px)}
  #black{position:absolute;inset:0;background:#000;opacity:0}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Kufi Arabic'}
  #title .a{font-size:74px;font-weight:900;color:#e8e8e8;opacity:0}
  #title .b{font-size:32px;font-weight:600;color:#8a8a8a;margin-top:26px;opacity:0}
  #ask{position:absolute;left:0;right:0;top:200px;display:flex;flex-direction:column;align-items:center;gap:24px;font-family:'Noto Kufi Arabic';pointer-events:none}
  #ask .qq{font-size:70px;font-weight:900;color:#f2f2f2;text-shadow:0 0 30px #000,0 4px 12px #000;opacity:0}
  #ask .op{width:560px;padding:18px 24px;border:2px solid rgba(240,213,140,.55);border-radius:18px;background:rgba(8,10,12,.75);color:#f4ead4;font-size:38px;font-weight:800;text-align:center;opacity:0;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #ask .op.b{border-color:rgba(208,71,61,.6)}
  #ask .cm{font-family:'Tajawal';font-size:30px;font-weight:700;color:#c9d1d5;opacity:0;margin-top:6px}
  .osd{font-family:'IBM Plex Mono',monospace;fill:#e6f0e6}
</style>
</head>
<body>
<div id="stage">
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="gBulb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd58a" stop-opacity=".9"/><stop offset=".35" stop-color="#e2a64e" stop-opacity=".35"/><stop offset="1" stop-color="#e2a64e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gSpill" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#f3c068" stop-opacity=".75"/><stop offset=".5" stop-color="#b9873d" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="gPhone" cx="50%" cy="100%" r="80%"><stop offset="0" stop-color="#cfe3f5" stop-opacity=".75"/><stop offset=".55" stop-color="#7fa6c8" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>

    <linearGradient id="gHood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f272e"/><stop offset="1" stop-color="#0d1115"/></linearGradient>
    <linearGradient id="gSkin" x1="0" x2="1"><stop offset="0" stop-color="#4a3428"/><stop offset=".55" stop-color="#7a5944"/><stop offset="1" stop-color="#8d6a52"/></linearGradient>
    <radialGradient id="gLampFloor" cx="70%" cy="80%" r="75%"><stop offset="0" stop-color="#e7b25e" stop-opacity=".55"/><stop offset=".6" stop-color="#9c7339" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="gMoon" x1="1" x2="0"><stop offset="0" stop-color="#5a7fa6" stop-opacity=".45"/><stop offset="1" stop-color="#5a7fa6" stop-opacity="0"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060a"/><stop offset=".6" stop-color="#0b1621"/><stop offset="1" stop-color="#1a2532"/></linearGradient>
    <linearGradient id="gCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></linearGradient>
    <filter id="fBlur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="fBlur14"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="fBlur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="fDof"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="eyeL"><path d="M276 572 Q305 548 336 570 Q306 586 276 572Z"/></clipPath>
    <clipPath id="eyeR"><path d="M390 570 Q420 548 450 572 Q420 586 390 570Z"/></clipPath>
    <clipPath id="eyeP"><path d="M300 560 Q318 548 338 558 Q320 570 300 560Z"/></clipPath>
  </defs>
</svg>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gCrt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2420"/><stop offset="1" stop-color="#0a0e0c"/></linearGradient>
  <radialGradient id="gScreenGlow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#a8d8b8" stop-opacity=".35"/><stop offset="1" stop-color="#a8d8b8" stop-opacity="0"/></radialGradient>
  <pattern id="pScan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".28"/></pattern>
  <filter id="fSmoke"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .55  0 0 0 0 .55  0 0 0 1.4 -.45"/></filter>
</defs></svg>

<!-- every scene: <g class="cam"> with parallax layers L0 (far) · L1 · C (characters) · L2 (foreground) -->
<div class="scene" id="s_living"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"></g><g class="L1"></g><g class="C"></g><g class="L2"></g></g></svg></div>
<div class="scene" id="s_face"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"></g><g class="C"></g><g class="L2"></g></g></svg></div>
<div class="scene" id="s_door"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"></g><g class="L1"></g><g class="C"></g><g class="L2"></g></g></svg></div>
<div class="scene" id="s_hall"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"></g><g class="L1"></g><g class="C"></g><g class="L2"></g></g></svg></div>

<div class="scene" id="s_mon"><svg viewBox="0 0 720 1280"><g class="cam">
  <rect x="-200" y="-200" width="1120" height="1700" fill="#0d0f0e"/>
  <rect x="20" y="230" width="680" height="640" rx="40" fill="#24282a" stroke="#0a0b0b" stroke-width="8"/>
  <rect x="58" y="268" width="604" height="530" rx="46" fill="#000"/>
  <svg x="58" y="268" width="604" height="530" viewBox="0 0 720 632" preserveAspectRatio="xMidYMid slice"><g class="feed"></g>
    <rect width="720" height="632" fill="url(#pScan)"/><g class="osdG"><text class="osd osdL" x="24" y="46" font-size="30">● CAM 03</text><text class="osd osdR" x="696" y="46" font-size="30" text-anchor="end">17-11-2019 03:19</text></g>
    <rect class="feedBlank" width="720" height="632" fill="#000" opacity="0"/></svg>
  <rect x="58" y="268" width="604" height="530" rx="46" fill="url(#gScreenGlow)" style="mix-blend-mode:screen"/>

  <rect x="80" y="820" width="60" height="20" rx="4" fill="#3a3f42"/><circle class="powerLed" cx="620" cy="830" r="7" fill="#4ad06a"/>
</g></svg></div>

<div id="black"></div>
<div id="ask"><div class="qq">تفتحون الباب؟</div><div class="op a">نفتح ونواجهه 🚪</div><div class="op b">نقفل وننتظر 🔒</div><div class="cm">اكتب اختيارك بالتعليقات</div></div>
<div id="title"><div class="a">الساكن الأخير</div><div class="b">الحلقة السادسة — الحارس</div></div>
<canvas id="grain" width="420" height="700"></canvas>
<div id="vig"></div>
<div id="caps"></div>
</div>

<script src="timeline.js"></script>
<script src="voice_env.js"></script>
<script src="rig.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const lerp=(a,b,k)=>a+(b-a)*k;
const A=i=>SEG[i].a, B=i=>SEG[i].b;
const VO_END=B(129), ASK_END=VO_END+5.0, DURATION=ASK_END+5.2;
const T=(e,v)=>e&&e.setAttribute('transform',v);
const flick=(t,seed=1)=>{const v=Math.sin(t*37*seed)*Math.sin(t*11.3+seed)*Math.sin(t*3.1);return v>.55?.75:(v>.4?.3:0)};
let CUR=0;
// lip sync: loudness of the recording at time t (only used while that character is speaking in-scene)
const venv=t=>{const i=Math.floor(t*30);return VENV[i]||0};
const inSeg=(t,list)=>list.some(([a,b])=>t>=A(a)-.02&&t<=B(b)+.02);
const talk=(t,list)=>inSeg(t,list)?venv(t):0;
// who speaks which quoted lines (segment index ranges, inclusive)
const SPEAK={
  father:[[6,6],[25,25],[74,75]],
  nawaf:[[9,10],[43,44],[50,51],[71,72],[91,92],[97,98]],
  guard:[[37,38],[47,49],[53,53],[57,57],[88,89],[94,95],[101,102]],
  oldGuard:[[63,63],[66,66]], fireman:[[64,64]], double:[[118,119]],
};

// ---------------------------------------------------------------- camera with parallax
function cam(sc,{x=0,y=0,s=1,r=0,shake=0}={}){
  const root=$(`#${sc} .cam`);T(root,`translate(360 640) rotate(${r}) scale(${s}) translate(-360 -640)`);
  const sx=shake?Math.sin(CUR*47)*shake:0, sy=shake?Math.cos(CUR*53)*shake:0;
  [['L0',.55],['L1',.8],['C',1],['L2',1.25]].forEach(([k,f])=>{const g=$(`#${sc} .${k}`);if(g)T(g,`translate(${-x*f+sx} ${-y*f+sy})`)});
}
// ---------------------------------------------------------------- environments
const BG={
living:()=>`<rect x="-400" y="-300" width="1520" height="1900" fill="#211b15"/>
  <rect x="-400" y="800" width="1520" height="800" fill="#15110d"/><rect x="-400" y="790" width="1520" height="14" fill="#2a2219"/>
  <rect x="-260" y="250" width="220" height="320" fill="#0e1823"/><line x1="-150" y1="250" x2="-150" y2="570" stroke="#211b15" stroke-width="8"/>
  <g class="frameW"><rect x="150" y="330" width="150" height="110" fill="#3a2b1b"/><rect x="160" y="340" width="130" height="90" fill="#6d6150" opacity=".6"/></g>`,
livingMid:()=>`<g class="frontDoor"><rect x="470" y="290" width="240" height="510" fill="#000"/>
    <g class="leaf"><rect x="470" y="290" width="240" height="510" fill="#2a2016" stroke="#0e0b08" stroke-width="6"/><rect x="490" y="312" width="200" height="210" fill="none" stroke="#1a130c" stroke-width="4"/>
    <circle cx="590" cy="400" r="7" fill="#c9b27a"/><rect x="490" y="520" width="26" height="14" rx="3" fill="#b8a06a"/><rect x="490" y="580" width="26" height="14" rx="3" fill="#b8a06a"/><circle cx="500" cy="560" r="10" fill="#c9b27a"/></g></g>
  <rect x="470" y="796" width="240" height="6" fill="#e7b25e" opacity=".55"/>
  <rect x="20" y="520" width="12" height="280" fill="#2b241c"/><path d="M-10 520 L 62 520 L 46 460 L 6 460Z" fill="#d9b27a"/>
  <ellipse class="lampG" cx="26" cy="520" rx="340" ry="320" fill="url(#gBulb)" opacity=".42"/>
  <path d="M60 820 L 60 640 C 60 610 80 600 110 600 L 270 600 C 300 600 310 610 310 640 L 310 820Z" fill="#3a2a22"/><rect x="50" y="700" width="270" height="70" rx="20" fill="#4a362b"/>`,
doorClose:()=>`<rect x="-300" y="-300" width="1320" height="1900" fill="#1a140f"/>
  <rect x="60" y="-100" width="600" height="1260" fill="#000"/>
  <g class="leaf"><rect x="60" y="-100" width="600" height="1260" fill="url(#gWood)" stroke="#0a0806" stroke-width="10"/>
   <rect x="110" y="-40" width="500" height="520" fill="none" stroke="#120e0a" stroke-width="7"/><rect x="110" y="560" width="500" height="560" fill="none" stroke="#120e0a" stroke-width="7"/>
   <rect x="96" y="560" width="26" height="90" rx="8" fill="#a8925f"/><circle cx="109" cy="604" r="18" fill="#c9b27a"/><rect x="96" y="680" width="40" height="22" rx="4" fill="#b8a06a"/></g>
  <rect x="-300" y="1160" width="1320" height="400" fill="#100c09"/><rect x="60" y="1154" width="600" height="10" fill="#ffd27a" class="gap"/>`,
hall:(w)=>{let s=`<rect x="-600" y="-300" width="${w+1200}" height="1900" fill="#151a1e"/><rect x="-600" y="880" width="${w+1200}" height="700" fill="#0f1215"/><rect x="-600" y="870" width="${w+1200}" height="12" fill="#22292e"/>`;
  for(let i=0;i<w/420+2;i++){const x=i*420-200;s+=`<rect x="${x}" y="330" width="170" height="550" fill="#231c15" stroke="#0e0b08" stroke-width="5"/><circle cx="${x+20}" cy="620" r="6" fill="#b8a06a"/><text x="${x+85}" y="310" text-anchor="middle" font-family="IBM Plex Mono" font-size="26" fill="#8a7f6a" direction="ltr">${300+i}</text>`;
   s+=`<rect x="${x+250}" y="120" width="40" height="10" fill="#2a2a24"/><ellipse cx="${x+270}" cy="132" rx="70" ry="26" fill="url(#gBulb)" opacity=".45"/>`}
  s+=`<g class="stairs"><rect x="840" y="330" width="200" height="550" fill="#3c4a44"/><rect x="880" y="270" width="120" height="40" rx="5" fill="#0d3a22"/><text x="940" y="298" text-anchor="middle" font-family="Tajawal" font-weight="800" font-size="22" fill="#9ff0bd">درج</text></g>`;
  s+=`<g class="lift"><rect x="1680" y="330" width="220" height="550" fill="#2c3237"/><rect x="1686" y="336" width="104" height="544" fill="#4a5157"/><rect x="1790" y="336" width="104" height="544" fill="#474e54"/><rect x="1750" y="290" width="80" height="30" fill="#050505"/><text x="1790" y="314" text-anchor="middle" font-family="IBM Plex Mono" font-size="22" fill="#f0a640" direction="ltr">3</text></g>`;
  return s},
gdoor:()=>`<rect x="-300" y="-300" width="1320" height="1900" fill="#12171a"/><rect x="-300" y="880" width="1320" height="700" fill="#0d1012"/>
  <rect x="200" y="300" width="320" height="580" fill="#000"/>
  <g class="leaf"><rect x="200" y="300" width="320" height="580" fill="#2f3a3a" stroke="#0a0c0c" stroke-width="6"/><rect x="240" y="340" width="240" height="140" fill="#1a2020"/><circle cx="230" cy="620" r="10" fill="#9aa0a5"/></g>
  <rect x="260" y="250" width="200" height="40" rx="6" fill="#d8d0b8"/><text x="360" y="279" text-anchor="middle" font-family="Tajawal" font-weight="800" font-size="24" fill="#2a2016">غرفة الحارس</text>
  <ellipse cx="360" cy="230" rx="160" ry="50" fill="url(#gBulb)" opacity=".35"/>
  <g class="camBox"><rect x="560" y="200" width="60" height="18" rx="4" fill="#bfc3c6"/><path d="M566 218 C 566 252 614 252 614 218Z" fill="#d6dadd"/><circle cx="590" cy="234" r="9" fill="#07090b"/><circle cx="610" cy="222" r="3" fill="#ff3b30"/></g>`,
groom:()=>{let s=`<rect x="-400" y="-300" width="1520" height="1900" fill="#171a17"/><rect x="-400" y="900" width="1520" height="700" fill="#100f0d"/>`;
  // monitor wall
  s+=`<rect x="-120" y="250" width="560" height="420" fill="#0b0d0c"/>`;
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){const x=-100+c*180,y=270+r*200;s+=`<rect x="${x}" y="${y}" width="164" height="180" rx="14" fill="#24282a"/><rect class="mini" x="${x+12}" y="${y+12}" width="140" height="120" rx="16" fill="#1b2a22"/><rect x="${x+12}" y="${y+12}" width="140" height="120" rx="16" fill="url(#pScan)"/>`}
  // shelves with tapes
  s+=`<g class="shelves">`;for(let r=0;r<4;r++){s+=`<rect x="480" y="${220+r*150}" width="300" height="12" fill="#3a2b1b"/>`;for(let k=0;k<11;k++)s+=`<rect x="${486+k*26}" y="${r*150+150}" width="22" height="70" fill="${['#1b1b1b','#262222','#1e1e24'][k%3]}"/><rect x="${489+k*26}" y="${r*150+165}" width="16" height="20" fill="#d9d2c4" opacity=".8"/>`}s+=`</g>`;
  // desk + VHS + chair
  s+=`<rect x="-160" y="740" width="640" height="30" fill="#3a2b1b"/><rect x="-140" y="770" width="20" height="140" fill="#2a1f14"/><rect x="430" y="770" width="20" height="140" fill="#2a1f14"/>
   <g class="vcr"><rect x="60" y="690" width="230" height="50" rx="4" fill="#202224"/><rect x="80" y="704" width="110" height="10" fill="#050505"/><text class="vcrT" x="270" y="722" text-anchor="end" font-family="IBM Plex Mono" font-size="16" fill="#4ad06a" direction="ltr">--:--</text></g>
   <rect x="320" y="640" width="100" height="100" rx="8" fill="#2b2d2e"/>`;
  s+=`<rect x="-300" y="80" width="18" height="140" fill="#222"/><ellipse class="bulb" cx="200" cy="120" rx="260" ry="140" fill="url(#gBulb)" opacity=".45"/><rect x="190" y="60" width="20" height="40" fill="#333"/><circle cx="200" cy="110" r="14" fill="#ffd58a"/>`;
  return s}
};

// ---------------------------------------------------------------- feeds (CCTV / VHS content), drawn in 720x632
const FEED={
fire:()=>`<rect width="720" height="632" fill="#2a2a28"/><polygon points="0,0 720,0 470,200 250,200" fill="#1e1e1c"/><polygon points="0,0 250,200 250,420 0,632" fill="#363632"/><polygon points="720,0 470,200 470,420 720,632" fill="#30302c"/>
  <rect x="250" y="200" width="220" height="220" fill="#222"/><polygon points="250,420 470,420 720,632 0,632" fill="#3c3a34"/>
  <g class="fC"></g><rect class="smokeL" x="-200" y="-100" width="1200" height="900" filter="url(#fSmoke)" opacity=".5"/>
  <rect width="720" height="632" fill="#ff8a3a" opacity=".07"/>`,
lift:()=>`<rect width="720" height="632" fill="#262a2c"/><rect x="200" y="60" width="320" height="520" fill="#1a1d1f"/>
  <g class="lInside"><rect x="214" y="74" width="292" height="506" fill="#3a4147"/><rect x="214" y="74" width="292" height="20" fill="#e3eef2" opacity=".7"/></g>
  <g class="lD1"><rect x="214" y="74" width="146" height="506" fill="#4a5157"/></g><g class="lD2"><rect x="360" y="74" width="146" height="506" fill="#474e54"/></g>
