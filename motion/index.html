<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جندي على الحدود الرقمية</title>
<style>@font-face{font-family:Tj;font-weight:500;src:url(fonts/tajawal-arabic-500-normal.woff2) format('woff2')}@font-face{font-family:Tj;font-weight:700;src:url(fonts/tajawal-arabic-700-normal.woff2) format('woff2')}@font-face{font-family:Tj;font-weight:800;src:url(fonts/tajawal-arabic-800-normal.woff2) format('woff2')}@font-face{font-family:Tj;font-weight:900;src:url(fonts/tajawal-arabic-900-normal.woff2) format('woff2')}html,body{margin:0;background:#000;height:100%}body{display:flex;align-items:center;justify-content:center}
canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;object-fit:contain;display:block}
#play{position:fixed;inset:0;margin:auto;width:110px;height:110px;border-radius:50%;border:2px solid #26e8a0;background:rgba(0,0,0,.5);color:#26e8a0;font-size:40px;cursor:pointer}
body.render #play{display:none}</style></head>
<body><canvas id="c"></canvas><button id="play">▶</button><audio id="a" src="audio.wav" preload="auto"></audio>
<script src="lib.js"></script><script src="scenes1.js"></script><script src="scenes2.js"></script><script src="scenes3.js"></script><script src="overlay.js"></script><script src="typo.js"></script><script src="engine.js"></script>
<script>
setup(document.getElementById('c'));
window.fontsReady=Promise.all([imagesReady,...[500,700,800,900].map(w=>document.fonts.load(`${w} 80px Tj`,'جندي'))]);
const RENDER=location.search.includes('render');if(RENDER)document.body.classList.add('render');
window.frameAt=(t)=>{render(t);return cv.toDataURL('image/jpeg',.93);};
if(!RENDER){fontsReady.then(()=>render(0.01));const a=document.getElementById('a');let t0=null;
 document.getElementById('play').onclick=e=>{e.target.style.display='none';a.currentTime=0;a.play().catch(()=>{});t0=performance.now();requestAnimationFrame(loop);};
 function loop(){const t=a.paused||!a.duration?(performance.now()-t0)/1000:a.currentTime;render(Math.min(t,OUT-.001));if(t<OUT)requestAnimationFrame(loop);else document.getElementById('play').style.display='block';}}
</script></body></html>
