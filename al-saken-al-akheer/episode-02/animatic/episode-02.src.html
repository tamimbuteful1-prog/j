<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;width:720px;height:1280px;overflow:hidden}
  #stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#000}
  .scene{position:absolute;inset:0;opacity:0}
  .scene>svg,.full{position:absolute;inset:0;width:720px;height:1280px;overflow:visible}
  /* ---------- CCTV feed ---------- */
  #feedBox{position:absolute;left:0;top:160px;width:720px;height:960px;overflow:hidden;background:#000;transform-origin:0 0}
  #feedBox svg{position:absolute;inset:0;width:720px;height:960px}
  .cctvLook{filter:grayscale(1) sepia(.35) hue-rotate(55deg) saturate(.9) contrast(1.15) brightness(1.05)}
  #feedOv{position:absolute;inset:0;pointer-events:none;font-family:'IBM Plex Mono',monospace;color:#d9f2dc;font-size:26px;text-shadow:0 0 4px rgba(0,0,0,.9)}
  #feedOv .tl{position:absolute;left:24px;top:20px;direction:ltr}
  #feedOv .tr{position:absolute;right:24px;top:20px;direction:ltr}
  #feedOv .bl{position:absolute;left:24px;bottom:18px;direction:ltr;font-size:22px;opacity:.85}
  #feedOv .rec{display:inline-block;width:16px;height:16px;border-radius:50%;background:#e33;margin-right:8px;vertical-align:1px}
  #scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);pointer-events:none}
  #feedNoise{position:absolute;inset:0;width:720px;height:960px;opacity:.16;mix-blend-mode:screen;pointer-events:none}
  #feedVig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at center,transparent 55%,rgba(0,0,0,.85) 100%);pointer-events:none}
  #feedGlitch{position:absolute;inset:0;background:#000;opacity:0}
  #feedFrame{position:absolute;left:0;top:160px;width:720px;height:960px;border-top:1px solid #1d2a22;border-bottom:1px solid #1d2a22;pointer-events:none}
  /* ---------- phone ---------- */
  .ph{position:absolute;width:340px;height:700px;border-radius:48px;background:#050607;border:3px solid #23292d;box-shadow:0 0 0 2px #0b0d0f,0 30px 80px rgba(0,0,0,.8),0 0 160px rgba(120,170,210,.16);overflow:hidden;font-family:'Tajawal',sans-serif;direction:rtl}
  .scr{position:absolute;inset:10px;border-radius:38px;overflow:hidden;background:#000}
  .psb{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 24px 0;font-size:14px;color:#d5dcdf;direction:ltr;font-weight:700;z-index:5}
  .papp{position:absolute;top:40px;left:0;right:0;text-align:center;color:#9fb0b8;font-size:13px;z-index:5}
  .phFeed{position:absolute;left:0;right:0;top:120px;height:430px;overflow:hidden;background:#000}
  .bn{position:absolute;top:56px;left:10px;right:10px;background:rgba(36,46,54,.95);border-radius:20px;padding:12px 14px;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .bn .t{display:flex;justify-content:space-between;font-size:12px;color:#9fb0b8}
  .bn .m{font-size:19px;font-weight:800;color:#f1f4f6;margin-top:4px}
  .lost{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#7b8389;font-size:17px;text-align:center}
  .lost .ic{font-size:30px;color:#51585d}
  /* ---------- phone clock close ---------- */
  #bigclock{position:absolute;left:0;right:0;top:470px;text-align:center;font-family:'Tajawal';font-weight:300;font-size:220px;color:#eef3f5;direction:ltr;letter-spacing:-6px}
  #bigclock small{font-size:60px;font-weight:500;letter-spacing:0;margin-left:14px;color:#aebcc3}
  /* ---------- overlays ---------- */
  #caps{position:absolute;left:34px;right:34px;bottom:250px;text-align:center;font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:42px;line-height:1.55;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.95),0 0 26px rgba(0,0,0,.85)}
  #caps .y{color:#f0d58c} #caps .r{color:#d0473d} #caps .q{color:#f4ead4;font-weight:600}
  #tag{position:absolute;font-family:'Tajawal';font-weight:700;font-size:22px;color:#d9e1e5;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:8px;opacity:0}
  #grain{position:absolute;inset:-60px;opacity:.06;mix-blend-mode:screen;pointer-events:none}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at center,transparent 45%,rgba(0,0,0,.8) 100%),linear-gradient(to top,rgba(0,0,0,.55) 0,transparent 380px)}
  #black{position:absolute;inset:0;background:#000;opacity:0}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Kufi Arabic'}

  .split{position:absolute;left:0;width:720px;height:560px;overflow:hidden}
  .split svg{position:absolute;inset:0;width:720px;height:560px}
  .splitLbl{position:absolute;right:20px;top:16px;font-family:'Tajawal';font-weight:800;font-size:22px;color:#e9eef0;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:8px;z-index:3}
</style>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const lerp=(a,b,k)=>a+(b-a)*k;
const A=i=>SEG[i].a, B=i=>SEG[i].b;
const END_CUT=B(62)+1.15;           // cut to black before the reveal
const DURATION=END_CUT+6.2;

function inst(id,target){target.innerHTML+=document.getElementById(id).textContent}
inst('tRoom',$('#s_room .cam'));
inst('tRoom',$('#s_face .bgRoom'));
inst('tFace',$('#s_face .cam'));
inst('tFace',$('#feedFace .ffcam'));
inst('tFace',$('#lost .reflFace'));
inst('tRoom',$('#feedRoom .frcam'));
inst('tBody',$('#feedCorr .dbl'));
$('#feedRoom .frcam').innerHTML+='<g class="rdbl"></g>';inst('tBody',$('#feedRoom .rdbl'));
inst('tRoom',$('#s_split .sTop'));inst('tRoom',$('#s_split .sBot'));
$('#s_split .sBot').innerHTML+='<g class="sdbl"></g>';inst('tBody',$('#s_split .sdbl'));
// static states
$$('#feedRoom .sitN, #feedRoom .sleepN, #s_split .sBot .sitN, #s_split .sBot .sleepN, #s_split .sTop .sleepN').forEach(e=>e.setAttribute('opacity',0));
$$('#s_split .sTop .sitN').forEach(e=>e.setAttribute('opacity',1));
$$('#s_split .sTop .sitGlow').forEach(e=>e.setAttribute('opacity',.7));
$$('.fshade').forEach(e=>e.setAttribute('opacity',0));
$('#s_split .sdbl').setAttribute('transform','translate(470 1050) scale(.42)');
$('#feedRoom .rdbl').setAttribute('transform','translate(470 1050) scale(.42)');
$$('#feedRoom .lampGlow,#s_split .sBot .lampGlow').forEach(e=>e.setAttribute('opacity',.5));

function setT(el,s){if(el)el.setAttribute('transform',s)}
function cam(el,{x=0,y=0,s=1,r=0,ox=360,oy=640}){setT(el,`translate(${ox+x} ${oy+y}) rotate(${r}) scale(${s}) translate(${-ox} ${-oy})`)}
const hh=(t,amp=1)=>[amp*(Math.sin(t*1.1)*1.4+Math.sin(t*2.3+1)*.6), amp*(Math.sin(t*.9+2)*1.2+Math.sin(t*2.9)*.5)];
const blink=(t,period=4.6,off=0)=>{const p=((t+off)%period);return p<.14?Math.abs(p-.07)/.07:1};

function faceRig(root,{open=1,lookX=0,lookY=0,brow=0,mouth=0,phone=0,turn=0,breath=0,smile=0}){
  const lidH=(1-open)*50;
  root.querySelectorAll('.lidL,.lidR').forEach(l=>l.setAttribute('height',lidH));
  root.querySelectorAll('.irisL,.irisR').forEach(g=>setT(g,`translate(${lookX*12} ${lookY*7})`));
  root.querySelectorAll('.browL,.browR').forEach(g=>setT(g,`translate(0 ${-brow*10})`));
  root.querySelector('.mouth').setAttribute('ry',mouth*10);
  const m=root.querySelector('.mline');
  m.setAttribute('d',`M${328-smile*10} ${716-smile*10} Q362 ${709+smile*18} ${396+smile*10} ${716-smile*10}`);
  root.querySelector('.phoneLight').setAttribute('opacity',phone);
  setT(root.querySelector('.head'),`translate(${turn*14} ${breath*3}) rotate(${turn*2} 362 600)`);
}
function bodyRig(g,{wave=0,headUp=0,headTurn=0,shade=0,smile=0}){
  setT(g.querySelector('.armR'),`rotate(${-wave*150} 64 -440)`);
  setT(g.querySelector('.bhead'),`translate(${headTurn*6} ${(1-headUp)*8}) rotate(${headTurn*-8+(1-headUp)*0} 0 -500)`);
  g.querySelector('.fshade').setAttribute('opacity',shade);
  g.querySelector('.bmouth').setAttribute('d',`M${-12-smile*3} ${-508-smile*3} Q0 ${-510+smile*7} ${12+smile*3} ${-508-smile*3}`);
}
function roomState(root,{sit=0,sleep=0,glow=0}){root.querySelectorAll('.sitN').forEach(e=>e.setAttribute('opacity',sit));root.querySelectorAll('.sleepN').forEach(e=>e.setAttribute('opacity',sleep));root.querySelectorAll('.sitGlow').forEach(e=>e.setAttribute('opacity',glow))}

// ---------- feed control ----------
const feedBox=$('#feedBox');
function feedMode(where){ // 'full' | 'phone' | null
  if(!where){if(feedBox.parentNode!==$('#park'))$('#park').appendChild(feedBox);return}
  if(where==='full'){if(feedBox.parentNode!==$('#feedHost'))$('#feedHost').appendChild(feedBox);feedBox.style.transform='none';feedBox.style.top='160px';}
  else if(where==='phone'){if(feedBox.parentNode!==$('#phFeed'))$('#phFeed').appendChild(feedBox);const k=314/720;feedBox.style.top='0px';feedBox.style.transform=`scale(${k})`;}
}
function feedView(v){$('#feedCorr').style.opacity=v==='corr'?1:0;$('#feedFace').style.opacity=v==='face'?1:0;$('#feedRoom').style.opacity=v==='room'?1:0;
  $('#feedLbl').textContent=v==='room'?'??? · LIVE':'CORRIDOR · LIVE';}
function feedTime(t){ // clock: 03:16:50 at A(8), 03:17:00 at A(13)+1.2
  const t17=A(13)+1.2; let sec=Math.floor(17*60+(t-t17)); if(t<t17) sec=Math.min(sec,17*60-1);
  const m=Math.floor(sec/60),s=((sec%60)+60)%60;
  $('#feedTs').textContent=`2026-11-18 03:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('#psbTime').textContent=`3:${String(m).padStart(2,'0')}`;
}
let feedFrozen=false;
const nctx=$('#feedNoise').getContext('2d');const NN=[];
(()=>{let s=17;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let f=0;f<6;f++){const im=nctx.createImageData(360,480);for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}NN.push(im)}})();
function feedNoise(t,amount=.16){if(!feedFrozen)nctx.putImageData(NN[Math.floor(t*30)%6],0,0);$('#feedNoise').style.opacity=amount}

// ---------- phone helpers ----------
function phoneCam(s,x=0,y=0){$('#s_phone .pcam').style.transform=`translate(${x}px,${y}px) scale(${s})`}
function banner(on,text){$('#bn').style.opacity=on;$('#bn').style.transform=`translateY(${(1-on)*-30}px)`;if(text)$('#bnText').textContent=text}
function lost(on){$('#lost').style.opacity=on}
function vibrate(t,start,dur=.7){return (t>start&&t<start+dur)?Math.sin(t*120)*4:0}

// ---------- timeline ----------
const TL=[];const S=(id,a,b,fn)=>TL.push({id,a,b,fn});

// 0 — recap: door + shadow, eyes, hand installs camera
S('s_door',0,1.7,(l,t)=>{cam($('#s_door .cam'),{s:1.15+l*.03,oy:1000,y:-60})});
S('s_face',1.7,A(1)+.9,(l,t)=>{cam($('#s_face .cam'),{s:1.9+l*.05,oy:568});faceRig($('#s_face'),{open:1,lookX:-.6,brow:.8,phone:.15});$('#s_face .bgRoom').setAttribute('opacity',.25)});
S('s_install',A(1)+.9,A(4),(l,t)=>{const k=ease(ramp(t,A(1)+.9,A(4)));cam($('#s_install .cam'),{s:1.0+k*.25,ox:330,oy:400});
  setT($('#s_install .driver'),`rotate(${Math.sin(t*5)*6} 410 320)`);
  const on=t>B(3)-.5?1:0;$('#s_install .led').setAttribute('opacity',on);$('#s_install .ledGlow').setAttribute('opacity',on*.7);
  $('#s_install .lensWipe').setAttribute('r',0)});
// 4 — corridor wide → into the lens → live feed on phone
S('s_corr',A(4),A(4)+2.3,(l,t)=>{const k=ease(ramp(l,0,2.3));cam($('#s_corr .cam'),{s:1.0+k*.9,ox:100,oy:288});$('#s_corr .cled').setAttribute('opacity',(Math.floor(t*2)%2)?1:.4)});
S('s_install',A(4)+2.3,A(4)+2.9,(l,t)=>{cam($('#s_install .cam'),{s:1.25+l*4,ox:330,oy:382});$('#s_install .led').setAttribute('opacity',1);$('#s_install .lensWipe').setAttribute('r',ramp(l,.2,.6)*900)});
S('s_phone',A(4)+2.9,A(5),(l,t)=>{feedMode('phone');feedView('corr');feedTime(t);feedNoise(t);$('#feedCorr .dbl').setAttribute('opacity',0);banner(0);lost(0);
  phoneCam(1.0+l*.02);$('#s_phone .ots').setAttribute('opacity',0)});
// 5–7 — second night: sitting on the bed, then over the shoulder to the screen
S('s_room',A(5),A(7),(l,t)=>{roomState($('#s_room'),{sit:1,glow:.7});cam($('#s_room .cam'),{s:1.05+l*.02,ox:560,oy:950});$('#s_room .whipBlur').setAttribute('opacity',0)});
S('s_phone',A(7),A(8),(l,t)=>{feedMode('phone');feedView('corr');feedTime(t);feedNoise(t);banner(0);lost(0);
  phoneCam(lerp(.9,1.05,ease(ramp(l,0,2))),lerp(-120,0,ease(ramp(l,0,2))),lerp(-80,0,ease(ramp(l,0,2))));$('#s_phone .ots').setAttribute('opacity',1)});
// 8 — 03:16
S('s_clockp',A(8),A(9),(l,t)=>{clockText('03:16')});
// 9–11 — normal: empty corridor, closed door
S('s_feed',A(9),A(12),(l,t)=>{feedMode('full');feedView('corr');feedTime(t);feedNoise(t);$('#feedCorr .dbl').setAttribute('opacity',0);setT($('#feedCorr .fcam'),'')});
// 12–13 — 03:17 flip
S('s_clockp',A(12),A(14),(l,t)=>{clockText(t>A(13)+1.2?'03:17':'03:16');const k=ease(ramp(t,A(12),A(14)));$('#bigclock').style.transform=`scale(${1+k*.12})`});
// 14–15 — motion alert
S('s_phone',A(14),A(16),(l,t)=>{feedMode('phone');feedView('corr');feedTime(t);feedNoise(t);lost(0);$('#feedCorr .dbl').setAttribute('opacity',0);
  banner(eo(ramp(t,A(15)-.05,A(15)+.25)),'تم اكتشاف حركة');$('#s_phone .ots').setAttribute('opacity',0);phoneCam(1.08,vibrate(t,A(15)-.05,.8))});
// 16–20 — someone at the door, walks toward the camera
S('s_feed',A(16),A(21),(l,t)=>{feedMode('full');feedView('corr');feedTime(t);feedNoise(t);
  const d=$('#feedCorr .dbl');d.setAttribute('opacity',ramp(t,A(17),A(17)+.6));
  const w=ease(ramp(t,A(19),B(20)));const y=lerp(560,1010,w),sc=lerp(.34,1.25,w);
  d.setAttribute('transform',`translate(${360+Math.sin(t*3)*w*4} ${y+Math.abs(Math.sin(t*3.2))*w*6}) scale(${sc})`);
  bodyRig(d,{shade:lerp(1,.25,ramp(w,.5,1)),headUp:1});
  setT($('#feedCorr .fcam'),`translate(360 400) scale(${1+ease(ramp(t,A(19),A(21)))*.08}) translate(-360 -400)`)});
// 21–22 — face reveal: it's me
S('s_feed',A(21),B(22)+.35,(l,t)=>{feedMode('full');feedView('face');feedTime(t);feedNoise(t,.2);
  cam($('#feedFace .ffcam'),{s:1.5,oy:600,y:30});faceRig($('#feedFace'),{open:1,lookX:0,lookY:0,brow:0,phone:0});
  $$('#feedFace .blueAmb').forEach(e=>e.setAttribute('opacity',.1))});
// real eyes — shock
S('s_face',B(22)+.35,A(23),(l,t)=>{cam($('#s_face .cam'),{s:2.3,oy:568});faceRig($('#s_face'),{open:1,lookX:0,lookY:.6,brow:1,phone:.7,mouth:.15})});
// 23 same face (feed) / 24 same hair (real) / 25 same clothes (split full figures)
S('s_feed',A(23),A(24),(l,t)=>{feedMode('full');feedView('face');feedTime(t);feedNoise(t,.2);cam($('#feedFace .ffcam'),{s:1.6+l*.05,oy:600});faceRig($('#feedFace'),{open:1})});
S('s_face',A(24),A(25),(l,t)=>{cam($('#s_face .cam'),{s:1.6+l*.05,oy:500});faceRig($('#s_face'),{open:1,lookY:.7,brow:.8,phone:.7})});
S('s_feed',A(25),A(26),(l,t)=>{feedMode('full');feedView('corr');feedTime(t);feedNoise(t);
  const d=$('#feedCorr .dbl');d.setAttribute('opacity',1);d.setAttribute('transform','translate(360 900) scale(1.05)');bodyRig(d,{shade:.15});
  setT($('#feedCorr .fcam'),`translate(360 420) scale(${1.0+l*.02}) translate(-360 -420)`)});
// 26–28 — but how? I'm on my bed, phone in hand
S('s_room',A(26),A(28),(l,t)=>{roomState($('#s_room'),{sit:1,glow:.8});cam($('#s_room .cam'),{s:1.6+l*.03,ox:560,oy:960});$('#s_room .whipBlur').setAttribute('opacity',0)});
S('s_phone',A(28),A(29),(l,t)=>{feedMode('phone');feedView('corr');feedTime(t);feedNoise(t);banner(0);lost(0);
  const d=$('#feedCorr .dbl');d.setAttribute('opacity',1);d.setAttribute('transform','translate(360 900) scale(1.05)');bodyRig(d,{shade:.15});
  $('#s_phone .ots').setAttribute('opacity',1);phoneCam(1.05)});
// 29–31 — stares into the lens… then smiles (eyes don't move)
S('s_feed',A(29),A(32),(l,t)=>{feedMode('full');feedView('face');feedTime(t);feedNoise(t,.18);
  const k=ease(ramp(t,A(29),A(31)));cam($('#feedFace .ffcam'),{s:1.35+k*.15,oy:620});
  faceRig($('#feedFace'),{open:1,lookX:0,lookY:0,smile:ease(ramp(t,A(31)-.45,B(31)+.45))*.95})});
// 32 — raises his hand like a greeting
S('s_feed',A(32),A(33),(l,t)=>{feedMode('full');feedView('corr');feedTime(t);feedNoise(t);
  const d=$('#feedCorr .dbl');d.setAttribute('opacity',1);d.setAttribute('transform','translate(360 960) scale(1.3)');
  bodyRig(d,{shade:.1,wave:ease(ramp(t,A(32),A(32)+1.4)),smile:.8});setT($('#feedCorr .fcam'),'translate(360 300) scale(1.25) translate(-360 -300)')});
// 33–36 — brings his face to the lens, speaks; background stops; slight smile
S('s_feed',A(33),A(37),(l,t)=>{feedMode('full');feedView('face');feedTime(t);feedFrozen=t>A(35);feedNoise(t,.2);
  const k=ease(ramp(t,A(33),A(34)));cam($('#feedFace .ffcam'),{s:lerp(1.3,2.6,k),oy:640});
  const talk=(t>A(34)&&t<B(36))?Math.abs(Math.sin(t*13))*.35:0;
  faceRig($('#feedFace'),{open:1,mouth:talk,smile:t>A(36)?.55:.35})});
// 37–39 — signal lost; black phone with his reflection
S('s_feed',A(37),A(38),(l,t)=>{feedMode('full');feedView('face');feedFrozen=true;feedNoise(t,.45);$('#feedGlitch').style.opacity=(Math.floor(t*30)%3===0)?.9:0});
S('s_phone',A(38),A(40),(l,t)=>{$('#feedGlitch').style.opacity=0;feedFrozen=false;lost(1);banner(0);$('#s_phone .ots').setAttribute('opacity',0);phoneCam(1.15+l*.03);
  faceRig($('#lost'),{open:1,lookY:.5,brow:.8})});
// 40 — trying to understand
S('s_face',A(40),A(41),(l,t)=>{cam($('#s_face .cam'),{s:1.5+l*.04,oy:580});faceRig($('#s_face'),{open:blink(t,3.0),lookY:.8,brow:.7,phone:.35,breath:Math.sin(t*2.2)})});
// 41–42 — "person detected behind you"
S('s_phone',A(41),A(43),(l,t)=>{lost(1);banner(eo(ramp(t,A(42)-.1,A(42)+.2)),'تم اكتشاف شخص خلفك');phoneCam(1.15+ease(ramp(l,0,2.5))*.12,vibrate(t,A(42)-.1,.9))});
// 43–44 — eyes widen
S('s_face',A(43),A(45),(l,t)=>{const k=ease(ramp(t,A(43),A(45)));cam($('#s_face .cam'),{s:1.6+k*.8,oy:568});faceRig($('#s_face'),{open:lerp(.85,1,k),lookY:lerp(.7,0,k),lookX:lerp(0,.6,k),brow:lerp(.6,1.1,k),phone:.5})});
// 45 — whips around (motion blur) → 46 empty room
S('s_room',A(45),A(47),(l,t)=>{roomState($('#s_room'),{sit:0,glow:0});const w=1-ease(ramp(t,A(45),A(45)+.45));
  cam($('#s_room .cam'),{s:1.05,ox:360,oy:800,x:w*-500});$('#s_room .whipBlur').setAttribute('opacity',w*.85);
  $('#s_room .cam').setAttribute('filter',w>.05?'url(#fBlur14)':'')});
// 47 — back to the phone (black)
S('s_phone',A(47),A(48),(l,t)=>{lost(1);banner(0);phoneCam(1.12)});
// 48 — reconnects…
S('s_phone',A(48),A(49),(l,t)=>{feedMode('phone');feedView('room');feedTime(t);feedNoise(t,.5-.34*ramp(l,0,1));lost(1-ramp(t,A(48)+.4,A(48)+.7));banner(0);
  $('#feedRoom .rdbl').setAttribute('opacity',0);phoneCam(1.12+l*.04)});
// 49–50 — it's showing my room, from the inside
S('s_feed',A(49),A(51),(l,t)=>{feedMode('full');feedView('room');feedTime(t);feedNoise(t);$('#feedRoom .rdbl').setAttribute('opacity',0);
  cam($('#feedRoom .frcam'),{s:1+l*.01,ox:360,oy:840})});
// 51–53 — the double standing at my bed, looking at where I sit
S('s_feed',A(51),A(54),(l,t)=>{feedMode('full');feedView('room');feedTime(t);feedNoise(t);const d=$('#feedRoom .rdbl');d.setAttribute('opacity',ramp(t,A(51),A(51)+.4));
  bodyRig(d,{headUp:0,headTurn:1,shade:.2});cam($('#feedRoom .frcam'),{s:1+ease(ramp(t,A(51),A(54)))*.35,ox:520,oy:940})});
// 54–55 — comparison: my room vs the feed (I'm not in the picture)
S('s_split',A(54),A(56),(l,t)=>{bodyRig($('#s_split .sdbl'),{headUp:0,headTurn:1,shade:.2})});
// 56–58 — he raises his head and looks straight into the camera
S('s_feed',A(56),A(59),(l,t)=>{feedMode('full');feedView('room');feedTime(t);feedNoise(t);const d=$('#feedRoom .rdbl');d.setAttribute('opacity',1);
  const up=ease(ramp(t,A(57),A(57)+2.4));bodyRig(d,{headUp:up,headTurn:1-up,shade:.15,smile:.3});
  cam($('#feedRoom .frcam'),{s:1.35+ease(ramp(t,A(56),A(59)))*.9,ox:470,oy:820})});
// 59–60 — "Nawaf… don't turn around a second time" (through the phone)
S('s_phone',A(59),A(61),(l,t)=>{feedMode('phone');feedView('face');feedTime(t);feedNoise(t,.2);lost(0);banner(0);$('#s_phone .ots').setAttribute('opacity',1);
  cam($('#feedFace .ffcam'),{s:1.7,oy:620});faceRig($('#feedFace'),{open:1,smile:.25,mouth:(t>A(59)&&t<B(60))?Math.abs(Math.sin(t*12))*.3:0});
  phoneCam(lerp(1.1,1.75,ease(ramp(l,0,A(61)-A(59)))),0,lerp(0,-140,ease(ramp(l,0,A(61)-A(59)))))});
// 61–62 — "…because this time I'm really behind you": pull back from his face, dark room behind, cut
S('s_face',A(61),END_CUT,(l,t)=>{const k=ease(ramp(t,A(61),END_CUT));cam($('#s_face .cam'),{s:lerp(2.4,1.05,k),oy:568,y:lerp(0,60,k)});
  const bg=$('#s_face .bgRoom');bg.setAttribute('opacity',lerp(.1,.55,k));setT(bg,`translate(360 640) scale(${lerp(1.4,1,k)}) translate(-360 -640)`);
  faceRig($('#s_face'),{open:1,lookY:.85,lookX:0,brow:.9,phone:.75,breath:0})});

function clockText(s){const h=s+'<small>AM</small>';if($('#bigclock').innerHTML!==h)$('#bigclock').innerHTML=h}

// ---------- captions ----------
const HL={22:'r',42:'r',55:'r',62:'r',15:'y',38:'y',31:'y'};
const POP=new Set([22,42,55,62]);
const CAPS=[];
SEG.forEach((s,i)=>{
  const words=s.text.split(' ');const cls=HL[i]||'';
  const wrap=txt=>cls?`<span class="${cls}">${txt}</span>`:(txt.startsWith('«')||txt.endsWith('»')?`<span class="q">${txt}</span>`:txt);
  const nextA=i+1<SEG.length?SEG[i+1].a:s.b+1.2;const end=Math.min(nextA-.05,s.b+.55);
  if(words.length>6){let cut=words.findIndex(w=>w.endsWith('،'))+1;if(cut<=0||cut>=words.length)cut=Math.ceil(words.length/2);
    const p1=words.slice(0,cut).join(' '),p2=words.slice(cut).join(' ');const mid=s.a+(s.b-s.a)*(p1.length/(p1.length+p2.length));
    CAPS.push([s.a,mid,wrap(p1),i]);CAPS.push([mid,end,wrap(p2),i]);}
  else CAPS.push([s.a,end,wrap(s.text),i]);
});
let lastCap=-1;
function caps(t){let k=-1;for(let j=0;j<CAPS.length;j++){if(t>=CAPS[j][0]&&t<CAPS[j][1])k=j}
  const el=$('#caps');if(k!==lastCap){el.innerHTML=k>=0?CAPS[k][2]:'';lastCap=k}
  if(k>=0){const e=eo(ramp(t,CAPS[k][0],CAPS[k][0]+.22));const pop=POP.has(CAPS[k][3]);el.style.opacity=e;el.style.transform=`scale(${pop?lerp(1.25,1.08,e):(.92+.08*e)})`}else el.style.opacity=0}

// ---------- grain ----------
const gc=$('#grain').getContext('2d');const NF=[];
(()=>{let s=29;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let f=0;f<6;f++){const im=gc.createImageData(420,700);for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}NF.push(im)}})();
$('#grain').style.width='840px';$('#grain').style.height='1400px';

function seek(t){
  let active=null;for(const s of TL){if(t>=s.a&&t<s.b)active=s}
  $$('.scene').forEach(e=>e.style.opacity=0);$('#feedGlitch').style.opacity=0;feedMode(null);
  if(active){const el=document.getElementById(active.id);el.style.opacity=1;
    if(active.id==='s_room')$('#s_room .cam').setAttribute('filter','');
    if(active.id!=='s_feed'||active.a<A(33))feedFrozen=false;
    active.fn(t-active.a,t);}
  // Real Nawaf blinks unless a scene overrides
  const blk=t>=END_CUT;$('#black').style.opacity=blk?1:0;
  $('#title .a').style.opacity=Math.min(ramp(t,END_CUT+1.0,END_CUT+1.7),1-ramp(t,DURATION-.7,DURATION-.1));
  $('#title .b').style.opacity=Math.min(ramp(t,END_CUT+2.2,END_CUT+2.9),1-ramp(t,DURATION-.7,DURATION-.1));
  caps(t);$('#caps').style.visibility=blk?'hidden':'visible';
  const f=Math.floor(t*30)%6;gc.putImageData(NF[f],0,0);$('#grain').style.transform=`translate(${(f*37)%60}px,${(f*53)%60}px)`;
}
window.seek=seek;window.DURATION=DURATION;
if(!location.search.includes('render')){let t0=null;const loop=ts=>{if(t0===null)t0=ts;seek(((ts-t0)/1000)%DURATION);requestAnimationFrame(loop)};document.fonts.ready.then(()=>requestAnimationFrame(loop));}
else seek(0);
</script>
