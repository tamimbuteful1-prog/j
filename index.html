<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="يومي — منصة تنظيم اليوم على شكل جدول زمني مرئي: خانات كل ٣٠ دقيقة، سحب وإفلات، مهام متكررة، وخط للوقت الحالي.">
  <title>يومي — جدولك الزمني المرئي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><rect x='22' y='24' width='56' height='12' rx='4' fill='white' opacity='.95'/><rect x='22' y='44' width='38' height='12' rx='4' fill='white' opacity='.75'/><rect x='22' y='64' width='48' height='12' rx='4' fill='white' opacity='.55'/></svg>">
</head>
<body>

  <!-- ============ شاشة الدخول ============ -->
  <div class="auth" id="authScreen" hidden></div>

  <!-- ============ التطبيق ============ -->
  <div class="app" id="app" hidden>

    <header class="topbar">
      <div class="topbar__brand"><span>ي</span><b>يومي</b></div>

      <div class="topbar__seg" role="group" aria-label="نمط العرض">
        <button data-mode="day" aria-pressed="true">اليوم</button>
        <button data-mode="week" aria-pressed="false">الأسبوع</button>
      </div>

      <div class="topbar__spacer"></div>

      <div class="topbar__user" id="userLabel"></div>

      <button class="btn btn--ghost btn--icon" id="btnAdd" title="مهمة جديدة (N)" aria-label="مهمة جديدة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="btn btn--ghost btn--icon" id="btnSettings" title="الإعدادات" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <main class="scroller" id="scroller">
      <div class="wrap">
        <nav class="daystrip" id="daystrip" aria-label="أيام الأسبوع"></nav>
        <section class="dayhead" id="dayhead"></section>
        <section class="nowbar" id="nowbar" hidden></section>
        <section class="board" id="board" aria-label="الجدول الزمني"></section>
        <p class="hint" style="text-align:center;margin:14px 0 30px">
          اضغط على أي خانة لإضافة مهمة · اسحب من المقبض لتغيير الوقت · اسحب الحافة العلوية أو السفلية لتغيير المدة ·
          اضغط مطوّلًا (أو بالزر الأيمن) لقائمة سريعة
        </p>
      </div>
    </main>
  </div>

  <button class="fab" id="fab" aria-label="مهمة جديدة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:system-ui">
      هذا التطبيق يحتاج إلى تفعيل JavaScript في المتصفح.
    </div>
  </noscript>

  <!-- إعدادات الاتصال بقاعدة البيانات (اختياري: يمكن إدخالها من داخل التطبيق) -->
  <script src="assets/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/schedule.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
