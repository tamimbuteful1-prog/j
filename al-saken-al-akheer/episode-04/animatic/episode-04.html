<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الساكن الأخير 04</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800;900&family=Tajawal:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;width:720px;height:1280px;overflow:hidden}
  #stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#000}
  .scene{position:absolute;inset:0;opacity:0}
  .scene>svg,.full{position:absolute;inset:0;width:720px;height:1280px;overflow:visible}
  .sepia{filter:sepia(.85) contrast(.92) brightness(.9)}
  #caps{position:absolute;left:34px;right:34px;bottom:250px;text-align:center;font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:42px;line-height:1.55;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.95),0 0 26px rgba(0,0,0,.85)}
  #caps .y{color:#f0d58c} #caps .r{color:#d0473d} #caps .q{color:#f4ead4;font-weight:600}
  #grain{position:absolute;inset:-60px;opacity:.07;mix-blend-mode:screen;pointer-events:none}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at center,transparent 45%,rgba(0,0,0,.8) 100%),linear-gradient(to top,rgba(0,0,0,.55) 0,transparent 380px)}
  #black{position:absolute;inset:0;background:#000;opacity:0}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Kufi Arabic'}
  #title .a{font-size:74px;font-weight:900;color:#e8e8e8;opacity:0}
  #title .b{font-size:32px;font-weight:600;color:#8a8a8a;margin-top:26px;opacity:0}
  /* audience question */
  #ask{position:absolute;left:0;right:0;top:250px;display:flex;flex-direction:column;align-items:center;gap:26px;font-family:'Noto Kufi Arabic';pointer-events:none}
  #ask .qq{font-size:76px;font-weight:900;color:#f2f2f2;text-shadow:0 0 30px #000,0 4px 12px #000;opacity:0}
  #ask .op{width:560px;padding:20px 26px;border:2px solid rgba(240,213,140,.55);border-radius:18px;background:rgba(8,10,12,.72);color:#f4ead4;font-size:38px;font-weight:800;text-align:center;opacity:0;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #ask .op.b{border-color:rgba(208,71,61,.6)}
  #ask .cm{font-family:'Tajawal';font-size:30px;font-weight:700;color:#c9d1d5;opacity:0;margin-top:6px}
  /* phone */
  .ph{position:absolute;width:340px;height:700px;border-radius:48px;background:#050607;border:3px solid #23292d;box-shadow:0 0 0 2px #0b0d0f,0 30px 80px rgba(0,0,0,.8),0 0 160px rgba(120,170,210,.16);overflow:hidden;font-family:'Tajawal',sans-serif;direction:rtl}
  .scr{position:absolute;inset:10px;border-radius:38px;overflow:hidden;background:#000}
  .scr>div{position:absolute;inset:0;opacity:0}
  .psb{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 24px 0;font-size:14px;color:#d5dcdf;direction:ltr;font-weight:700;z-index:5}
  .lock{background:radial-gradient(120% 80% at 50% 30%,#16222b 0%,#05080a 70%)}
  .lock .d{position:absolute;top:90px;width:100%;text-align:center;font-size:22px;color:#cbd5da;font-weight:700}
  .lock .t{position:absolute;top:116px;width:100%;text-align:center;font-size:110px;font-weight:300;color:#eef3f5;direction:ltr;letter-spacing:-3px}
  .camui{background:#000}
  .camui .vf{position:absolute;left:0;right:0;top:90px;height:420px;overflow:hidden;background:#111}
  .camui .modes{position:absolute;bottom:130px;width:100%;text-align:center;color:#e9c46a;font-size:15px;font-weight:700;letter-spacing:2px}
  .camui .shut{position:absolute;bottom:40px;left:50%;width:74px;height:74px;margin-left:-37px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.9)}
  .camui .thumb{position:absolute;bottom:52px;left:34px;width:46px;height:46px;border-radius:8px;background:#333;overflow:hidden;border:2px solid #fff}
  .camui .focus{position:absolute;border:2px solid #f2c94c;width:90px;height:90px}
  .gal{background:#000}
  .gal .bar{position:absolute;top:44px;left:0;right:0;text-align:center;color:#e9eef1;font-size:16px;font-weight:700}
  .gal .ph1{position:absolute;left:0;right:0;top:150px;height:330px;overflow:hidden;background:#111}
  .gal .meta{position:absolute;top:500px;width:100%;text-align:center;color:#8d989e;font-size:14px}
  .call{background:linear-gradient(#1b262d,#06090b);text-align:center}
  .call .w{margin-top:150px;font-size:44px;font-weight:800;color:#eef3f5}
  .call .s{margin-top:10px;font-size:20px;color:#9fb0b8;direction:ltr}
  .call .bt{position:absolute;bottom:90px;width:100%;display:flex;justify-content:center;gap:90px}
  .call .b{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
  .call .acc{background:#2fa84f}.call .dec{background:#c0392b}
  .call .bt2{position:absolute;bottom:90px;width:100%;display:flex;justify-content:center;gap:34px}
  .call .g{width:64px;height:64px;border-radius:50%;background:#26323a;color:#cfd8dc;font-size:12px;display:flex;align-items:center;justify-content:center}
  .flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
</head>

function faceRig(root,{open=1,lookX=0,lookY=0,brow=0,mouth=0,phone=0,turn=0,breath=0}){
  root.querySelectorAll('.lidL,.lidR').forEach(l=>l.setAttribute('height',(1-open)*50));
  root.querySelectorAll('.irisL,.irisR').forEach(g=>setT(g,`translate(${lookX*12} ${lookY*7})`));
  root.querySelectorAll('.browL,.browR').forEach(g=>setT(g,`translate(0 ${-brow*10})`));
  const m=root.querySelector('.mouth');if(m)m.setAttribute('ry',mouth*10);
  const pl=root.querySelector('.phoneLight');if(pl)pl.setAttribute('opacity',phone);
  setT(root.querySelector('.head'),`translate(${turn*14} ${breath*3}) rotate(${turn*2} 362 600)`);
}

S('s_side',A(73),A(75),(l,t)=>{const talk=Math.abs(Math.sin(t*15))*.8;sideRig({talk,lookX:-.3});cam($('#s_side .cam'),{s:1.25,ox:330,oy:560})});
// 75–77 — "don't look behind you, whatever you hear": the camera drifts behind him (empty dark)
S('s_zero',A(75),A(78),(l,t)=>{lightsOn=1;const k=ease(ramp(t,A(75),A(78)));zeroCam(lerp(.1,.3,k),{x:lerp(0,-60,k)});zNav({x:lerp(360,200,k),y:1300,s:1.3,back:0,lookX:0});zeroFlick(t);
  $('#s_zero .zBlack').setAttribute('opacity',.35)});
// 78–81 — footsteps behind; trembling hand; eyes strain sideways without turning
S('s_hands',A(78),A(80),(l,t)=>{const tr=Math.sin(t*45)*2+Math.sin(t*31)*1.2;setT($('#s_hands .hl'),`translate(${tr} 0)`);setT($('#s_hands .hr'),`translate(${-tr} 0)`);cam($('#s_hands .cam'),{s:1.15,oy:850})});
S('s_face',A(80),A(82),(l,t)=>{faceBg('zero',{tint:.2});cam($('#s_face .cam'),{s:2.4,oy:568});faceRig($('#s_face'),{open:1,lookX:lerp(0,1.1,ease(ramp(t,A(80),A(80)+.6))),brow:1,phone:.35})});
// 82–84 — the whisper at his ear (a presence out of focus behind him)
S('s_side',A(82),A(85),(l,t)=>{sideRig({blinkV:1,lookX:.6,shadow:ramp(t,A(83),A(83)+.6)*.85});cam($('#s_side .cam'),{s:1.25+l*.02,ox:420,oy:560})});
// 85–86 — the call is still running
S('s_pcl',A(85),A(87),(l,t)=>{screen('sAct');callTimer(t);$('#s_pcl .pOts').setAttribute('opacity',0);pcam(lerp(1.3,1.6,ease(ramp(l,0,2.5))),0,120)});
// 87–88 — dad shouts from the phone; he's between the two voices
S('s_face',A(87),A(89),(l,t)=>{faceBg('zero',{tint:.2});cam($('#s_face .cam'),{s:2.0,oy:568,x:Math.sin(t*20)*1});faceRig($('#s_face'),{open:1,lookX:t<A(88)?-.8:.8,brow:1.1,phone:.4});$('#s_face .behind').setAttribute('opacity',.6)});
// 89–90 — the hand
S('s_shoulder',A(89),A(91),(l,t)=>{const k=ease(ramp(t,A(90)-.1,A(90)+1.3));setT($('#s_shoulder .hand'),`translate(${lerp(320,-130,k)} ${lerp(-300,30,k)})`);cam($('#s_shoulder .cam'),{s:1.0+ease(ramp(t,A(90)+1.3,A(91)))*.08,oy:800})});
// 91–end — freeze: phone at his ear, the hand on his shoulder, darkness — the question
S('s_side',A(91),ASK_END,(l,t)=>{sideRig({blinkV:1,lookX:.3,hand:1,shadow:.6,dark:.3});cam($('#s_side .cam'),{s:1.0,ox:420,oy:640,x:-90,y:-60})});

// ---------- helpers ----------
function dust(a){const e=$('.wipeE');e.setAttribute('rx',(1-a)*420);e.setAttribute('ry',(1-a)*320);e.setAttribute('cx',300+(1-a)*-40)}
function wallPhotoAll(withFather){$$('#s_gphoto .gpUse').forEach(u=>u.setAttribute('href',withFather===false?'#gpWithout':(withFather===undefined?'#gpWith':(withFather?'#gpWith':'#gpWithout'))))}

// ---------- captions ----------
const HL={1:'r',25:'r',28:'y',39:'r',41:'r',47:'y',67:'y',77:'r',84:'r',90:'r'};
const POP=new Set([1,25,39,90]);
const CAPS=[];
SEG.forEach((s,i)=>{const words=s.text.split(' ');const cls=HL[i]||'';
  const wrap=txt=>cls?`<span class="${cls}">${txt}</span>`:(txt.startsWith('«')||txt.endsWith('»')?`<span class="q">${txt}</span>`:txt);
  const nextA=i+1<SEG.length?SEG[i+1].a:s.b+1.2;const end=Math.min(nextA-.05,s.b+.55);
  if(words.length>6){let cut=words.findIndex(w=>w.endsWith('،')||w.endsWith('…')||w.endsWith(':'))+1;if(cut<=0||cut>=words.length)cut=Math.ceil(words.length/2);
    const p1=words.slice(0,cut).join(' '),p2=words.slice(cut).join(' ');const mid=s.a+(s.b-s.a)*(p1.length/(p1.length+p2.length));
    CAPS.push([s.a,mid,wrap(p1),i]);CAPS.push([mid,end,wrap(p2),i]);}else CAPS.push([s.a,end,wrap(s.text),i]);});
let lastCap=-1;
function caps(t){let k=-1;for(let j=0;j<CAPS.length;j++){if(t>=CAPS[j][0]&&t<CAPS[j][1])k=j}
  const el=$('#caps');if(k!==lastCap){el.innerHTML=k>=0?CAPS[k][2]:'';lastCap=k}
  if(k>=0){const e=eo(ramp(t,CAPS[k][0],CAPS[k][0]+.22));const pop=POP.has(CAPS[k][3]);el.style.opacity=e;el.style.transform=`scale(${pop?lerp(1.25,1.08,e):(.92+.08*e)})`}else el.style.opacity=0}

// ---------- grain ----------
const gc=$('#grain').getContext('2d');const NF=[];
(()=>{let s=41;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let f=0;f<6;f++){const im=gc.createImageData(420,700);for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}NF.push(im)}})();
$('#grain').style.width='840px';$('#grain').style.height='1400px';

function seek(t){
  let active=null;for(const s of TL){if(t>=s.a&&t<s.b)active=s}
  $$('.scene').forEach(e=>e.style.opacity=0);
  if(active){const el=document.getElementById(active.id);el.style.opacity=1;
    if(active.id==='s_gphoto')$('#s_gphoto .cam').style.filter='none';
    if(active.id==='s_gwall'){$('#s_gwall .fgNawaf').setAttribute('opacity',1);$('#s_gwall .plDate').setAttribute('fill','#3a2a18')}
    if(active.id==='s_zero'){$('#s_zero .zPh').setAttribute('opacity',0);lightsOn=1}
    active.fn(t-active.a,t);}
  // question
  const q=$('#ask');q.querySelector('.qq').style.opacity=ramp(t,A(91)+.3,A(91)+1.0)*(1-ramp(t,ASK_END-.4,ASK_END));
  q.querySelector('.op.a').style.opacity=ramp(t,A(94),A(94)+.5)*(1-ramp(t,ASK_END-.4,ASK_END));q.querySelector('.op.a').style.transform=`translateY(${(1-eo(ramp(t,A(94),A(94)+.5)))*16}px)`;
  q.querySelector('.op.b').style.opacity=ramp(t,A(95),A(95)+.5)*(1-ramp(t,ASK_END-.4,ASK_END));q.querySelector('.op.b').style.transform=`translateY(${(1-eo(ramp(t,A(95),A(95)+.5)))*16}px)`;
  q.querySelector('.cm').style.opacity=ramp(t,VO_END+.8,VO_END+1.4)*(1-ramp(t,ASK_END-.4,ASK_END));
  const blk=t>=ASK_END;$('#black').style.opacity=blk?1:0;
  $('#title .a').style.opacity=Math.min(ramp(t,ASK_END+.8,ASK_END+1.5),1-ramp(t,DURATION-.7,DURATION-.1));
  $('#title .b').style.opacity=Math.min(ramp(t,ASK_END+2.0,ASK_END+2.7),1-ramp(t,DURATION-.7,DURATION-.1));
  caps(t);$('#caps').style.visibility=(blk||t>=A(91))?'hidden':'visible';
  const f=Math.floor(t*30)%6;gc.putImageData(NF[f],0,0);$('#grain').style.transform=`translate(${(f*37)%60}px,${(f*53)%60}px)`;
}
window.seek=seek;window.DURATION=DURATION;
if(!location.search.includes('render')){let t0=null;const loop=ts=>{if(t0===null)t0=ts;seek(((ts-t0)/1000)%DURATION);requestAnimationFrame(loop)};document.fonts.ready.then(()=>requestAnimationFrame(loop));}
else seek(0);
</script>
