<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>الساكن الأخير 09</title>
{{HEAD}}
<style>
  .rep{font-family:'Amiri',serif;color:#2a2016}
  .rep .hdr{font-size:15px;color:#6a5a40;text-align:center;border-bottom:2px solid #8a7a5a;padding-bottom:6px;margin-bottom:10px}
  .rep .pic{width:120px;height:150px;margin:0 auto 10px;border:3px solid #6a5a40;background:#c9b48a;overflow:hidden}
  .rep .ln{font-size:17px;line-height:1.7;opacity:.25;transition:none}
  .rep .ln.on{opacity:1}.rep .ln.hot{color:#8a1a12;font-weight:700}
  .rep .stamp{position:absolute;left:24px;bottom:40px;transform:rotate(-14deg);border:3px solid #8a1a12;color:#8a1a12;font:800 20px 'Tajawal';padding:2px 12px;opacity:.75}
  #cmp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:'Noto Kufi Arabic'}
  #cmp .row{display:flex;gap:18px}
  #cmp .card{width:290px;padding:22px 10px;border-radius:18px;background:#12161a;border:2px solid #2c343a;text-align:center;color:#e9eef1;font-size:34px;font-weight:800;opacity:0}
  #cmp .card small{display:block;font-size:22px;color:#8c99a0;font-weight:600;margin-bottom:6px}
  #cmp .wide{width:600px;color:#f0b0a8;border-color:#5a2a26;font-size:32px}
</style>
</head>
<body>
<div id="stage">
{{DEFS}}

<svg width="0" height="0" style="position:absolute"><defs>

</defs></svg>

  <rect class="phoneLit" width="720" height="1280" fill="url(#gPhone)" opacity="0" style="mix-blend-mode:screen"/></svg></div>

  <rect x="-400" y="-300" width="1520" height="1900" fill="#0d0b09"/><polygon points="-400,-300 320,520 320,700 -400,1700" fill="#1a140f"/><polygon points="1120,-300 400,520 400,700 1120,1700" fill="#16110d"/><polygon points="320,700 400,700 1120,1700 -400,1700" fill="#2b261e"/>
  <rect x="320" y="520" width="80" height="180" fill="#000"/><ellipse cx="360" cy="400" rx="60" ry="20" fill="url(#gBulb)" opacity=".5"/><g fill="#000" opacity=".5" filter="url(#fBlur14)"><ellipse cx="100" cy="500" rx="160" ry="300"/><ellipse cx="620" cy="600" rx="140" ry="300"/></g></g><g class="C"></g></g>
  <rect class="glitch" width="720" height="1280" fill="#fff" opacity="0"/></svg></div>
<div class="scene" id="s_cmp"><svg viewBox="0 0 720 1280" style="position:absolute;inset:0;width:720px;height:1280px"><rect width="720" height="1280" fill="#06080a"/></svg>
  <div id="cmp"><div class="row"><div class="card c1"><small>سالم</small>22 سنة</div><div class="card c2"><small>الولد</small>15 سنة</div></div><div class="card wide c3">الوفاة: قبل الحريق بثلاثة أيام</div></div></div>
<div class="scene" id="s_wall"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"><rect x="-400" y="-300" width="1520" height="1900" fill="#262c29"/><rect x="-400" y="-300" width="1520" height="1900" fill="url(#gStairFade)"/><ellipse cx="360" cy="420" rx="420" ry="260" fill="url(#gPool)"/></g><g class="C"><g class="wallSh" filter="url(#fBlur6)"></g></g></g></svg></div>

  <g class="C"><path d="M-200 1100 L 920 300" stroke="#4f5a54" stroke-width="36" stroke-linecap="round"/><path d="M-200 1100 L 920 300" stroke="#6b7770" stroke-width="8" opacity=".6"/><g class="kh"></g></g></g></svg></div>
<div class="scene" id="s_reveal"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"></g><g class="L1"><ellipse class="pool" cx="360" cy="860" rx="300" ry="520" fill="url(#gPool)"/></g><g class="C"></g></g></svg></div>
<div class="scene" id="s_kid"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"><rect x="-400" y="-300" width="1520" height="1900" fill="#151a17"/><ellipse cx="360" cy="420" rx="460" ry="360" fill="url(#gPool)"/></g><g class="C"></g><g class="L2"><g class="reachHand" opacity="0"></g></g></g></svg></div>
<div class="scene" id="s_memlift"><svg viewBox="0 0 720 1280" class="mem"><g class="cam"><g class="L0"><rect x="-400" y="-300" width="1520" height="1900" fill="#14120f"/><rect x="200" y="300" width="320" height="640" fill="#262b2f"/>
  <rect x="216" y="316" width="288" height="624" fill="#3a4147"/><rect x="216" y="316" width="288" height="24" fill="#e3eef2" opacity=".6"/><g class="lD1"><rect x="216" y="316" width="144" height="624" fill="#4a5157"/></g><g class="lD2"><rect x="360" y="316" width="144" height="624" fill="#474e54"/></g>
  <rect x="-400" y="940" width="1520" height="700" fill="#1d1a16"/></g><g class="C"></g></g><rect class="glitch" width="720" height="1280" fill="#fff" opacity="0"/></svg></div>
<div class="scene" id="s_final"><svg viewBox="0 0 720 1280"><g class="cam"><g class="L0"></g><g class="L1"><ellipse cx="560" cy="1250" rx="200" ry="200" fill="url(#gPool)"/></g><g class="C"></g></g></svg></div>

<div id="black"></div>
<div id="ask"><div class="qq">بتقرب منه؟</div><div class="op a">ألمسه وأعرف الحقيقة 🖐️</div><div class="op b">أهرب قبل ما يلمسني 🏃</div><div class="cm">اكتب اختيارك بالتعليقات</div></div>
<div id="title"><div class="a">الساكن الأخير</div><div class="b">الحلقة التاسعة — الولد اللي بالدرج</div></div>
<canvas id="grain" width="420" height="700"></canvas>
<div id="vig"></div>
<div id="caps"></div>
<div id="est">معاينة بدون صوت الراوي — التوقيت تقديري</div>
</div>

<script src="timeline.js"></script>
{{VENV}}

<script src="engine.js"></script>
<script>
const {A,B,ramp,ease,eo,lerp,clamp,T,$,$$,cam,pose,merge,idle,closeUp,blink,talk,inSeg,flick,hide,show,fill,mk,mkOldBody,mkOldFace}=E;
{{PEOPLE_JS}}
const SPEAK={child:[[0,0],[8,9],[20,20],[40,42],[55,57]],nawaf:[[19,19]],salem:[[34,35]],memBoy:[[16,16]]};

// ---------- sets (same stairwell as episode 8)
fill('s_stairs','L0',E.BG.stairs());
const STN=mkOldBody('s_stairs');
fill('s_stairs','L2','<g class="kidShadow" filter="url(#fBlur6)"><ellipse cx="560" cy="1290" rx="34" ry="40" fill="#000"/><path d="M520 1300 C 520 1340 600 1340 600 1300 L 610 1380 L 510 1380Z" fill="#000"/></g>');
const FC={naw:mkOldFace('s_face'),kid:E.oldFace($('#s_kid .C'),{young:true})};
document.getElementById('s_phone').innerHTML=E.phoneHTML('p9');
// memory: teen Nawaf running, holding a boy's hand (the boy stays faceless / in shadow)
const MEM={me:E.oldBody($('#s_mem .C'),{young:true}),boy:E.oldBody($('#s_mem .C'),{young:true})};
// the report: archival file inside the story's world (no real institution, no logo)
document.getElementById('p9-doc').innerHTML=`<div class="rep"><div class="hdr">أرشيف سكان العمارة — ملف خاص</div>
  <div class="pic"><svg viewBox="-80 -80 160 220" style="width:120px;height:150px" class="sepia"><rect x="-80" y="-80" width="160" height="220" fill="#b9a67e"/>${person({x:0,y:-40,s:1.3,skin:'#8a6a52',hair:HAIR_SHORT,cloth:'#3b3f44',cloth2:'#2c3035'})}</svg></div>
  <div class="ln l1">الاسم: سالم ناصر</div><div class="ln l2 hot">العمر عند الوفاة: 22 عامًا</div><div class="ln l3 hot">تاريخ الوفاة: قبل الحريق بثلاثة أيام</div><div class="ln l4">ملاحظة: الملف مغلق</div><div class="stamp">مغلق</div></div>`;
// ascent close-ups: shadow on the wall, the feet on the steps, the hand on the rail
$('#s_wall .wallSh').innerHTML='<ellipse cx="0" cy="-560" rx="40" ry="52" fill="#000"/><path d="M-60 -500 C -70 -380 -60 -260 -50 -200 L 50 -200 C 60 -260 70 -380 60 -500Z" fill="#000"/><rect x="-40" y="-200" width="34" height="220" fill="#000"/><rect x="6" y="-200" width="34" height="220" fill="#000"/>';
(()=>{let s='';for(let i=0;i<8;i++){const y=1200-i*170;s+=`<rect x="-200" y="${y}" width="1120" height="170" fill="${i%2?'#2a302d':'#262c29'}"/><rect x="-200" y="${y}" width="1120" height="12" fill="#3a423e"/>`}$('#s_feet .L0').innerHTML=s})();
$('#s_feet .legs').innerHTML=['L','R'].map(s=>`<g class="kl${s}"><rect x="-34" y="-520" width="68" height="300" rx="30" fill="#15181c"/><g class="kn${s}" transform="translate(0 -220)"><rect x="-30" y="0" width="60" height="230" rx="26" fill="#13161a"/><path d="M-36 220 C -40 260 -24 272 0 272 L 70 272 C 90 272 92 250 70 240 L 30 214Z" fill="#0b0b0b"/></g></g>`).join('');
$('#s_rail .kh').innerHTML='<path d="M0 0 C -40 -6 -70 10 -80 30 C -86 44 -72 54 -56 48 L -40 40 C -44 60 -30 70 -14 62 L 0 52 C 0 74 16 80 30 70 L 40 60 C 48 76 64 76 72 62 C 86 40 70 10 40 0Z" fill="#5f4535"/><path d="M40 0 L 140 -60 L 200 40 L 70 60Z" fill="url(#gHood)"/>';
fill('s_reveal','L0',E.BG.stairs());const RV=E.oldBody($('#s_reveal .C'),{young:true});
$('#s_kid .reachHand').innerHTML='<g transform="translate(360 1260)"><path d="M-80 220 L -60 40 L 60 40 L 80 220Z" fill="url(#gHood)"/><ellipse cx="0" cy="20" rx="70" ry="64" fill="#5f4535"/>'+
  [-48,-18,14,44].map((x,i)=>`<g class="kf" data-i="${i}" transform="translate(${x} -30)"><rect x="-13" y="-90" width="26" height="100" rx="13" fill="#5f4535" stroke="#3e2b20" stroke-width="2"/></g>`).join('')+'<g transform="translate(66 10) rotate(40)"><rect x="-13" y="-70" width="26" height="80" rx="13" fill="#5f4535" stroke="#3e2b20" stroke-width="2"/></g></g>';
const ML={a:E.oldBody($('#s_memlift .C'),{young:true}),b:E.oldBody($('#s_memlift .C'),{young:true})};
fill('s_final','L0',E.BG.stairs());const FN={naw:mkOldBody('s_final'),kid:E.oldBody($('#s_final .C'),{young:true})};

const MSG=[{who:'in',text:'اسمي سالم… وإذا تبي تعيش، اسمع كلامي!',at:-10},{who:'in',voice:true,at:-10,playFrom:-10,dur:6},
  {who:'in',file:'تقرير وفاة سالم.pdf',at:A(22)},{who:'in',voice:true,at:A(33)-.2,playFrom:A(34),dur:B(35)-A(34)},
  {who:'in',text:'لا تلمسه!',at:A(59)},{who:'in',text:'إذا لمسك… بتتذكر كل شي!',at:A(60)}];

function faceScene(who,{s=4.2,cy=600,lit=0,ache=0}={}){FC.naw.g.setAttribute('opacity',0);const c=FC[who];if(c!==FC.kid)c.g.setAttribute('opacity',1);$('#s_face .phoneLit').setAttribute('opacity',lit);$('#s_face .ache').setAttribute('opacity',ache);return [c,closeUp(s,360,cy)]}
function stairs(t,o={}){E.pose(STN,merge(idle(t,1),{x:o.nx??120,y:(o.ny??580)-470*.42,s:.42,head:{turn:.6,nod:o.nod??2},eyes:{x:1,y:o.ey??.8,blink:blink(t,1),wide:o.wide||0},armR:o.armR||{sh:-6},legR:o.legR,legL:o.legL}));
  $('#s_stairs .kidShadow').setAttribute('opacity',o.shadow??.85)}
const glitchAt=(t,a)=>(t>a&&t<a+.12)?.7:0;

const TL=[];const S=(id,a,b,fn)=>TL.push({id,a,b,fn});
// 0–2 — low angle: Nawaf at the top, a small shadow sitting on the lower landing: "I'm Salem."
S('s_stairs',0,A(3),(l,t)=>{stairs(t,{});const k=ease(ramp(t,A(1),A(3)));cam('s_stairs',{s:lerp(1.05,1.2,k),x:lerp(40,0,k),y:lerp(220,120,k)})});
// 3 — Salem's message is still on the phone
S('s_phone',A(3),A(4),(l,t)=>{E.renderChat('p9',MSG.slice(0,2),t);E.pcam('s_phone',1.2,0,40)});
// 4–6 — and below, a boy who says he's Salem: two with the same name
S('s_stairs',A(4),A(7),(l,t)=>{stairs(t,{});cam('s_stairs',{s:lerp(1.3,1.8,ease(ramp(l,0,3))),x:200,y:520})});
// 7–9 — "on the day of the fire we were together… and you left me" (shadow only); he steps back
S('s_stairs',A(7),A(10),(l,t)=>{stairs(t,{});cam('s_stairs',{s:1.9,x:200,y:560})});
S('s_face',A(10),A(11),(l,t)=>{const [c,f]=faceScene('naw',{s:4.2});pose(c,merge(f,{y:f.y-ease(ramp(l,0,.6))*14,brows:'doubt',eyes:{x:.7,y:.6,squint:.3,blink:blink(t,1)},mouth:'tense'}))});
// 11–12 — the headache (hand to the temple), push to the eyes
S('s_face',A(11),A(13),(l,t)=>{const k=ease(ramp(t,A(11),A(12)+.5));const [c,f]=faceScene('naw',{s:lerp(4.2,5.6,k),ache:ramp(t,A(11),A(11)+.4)});pose(c,merge(f,{brows:'sad',eyes:{blink:clamp(.2+Math.sin(t*9)*.25),squint:.6},mouth:'tense',head:{tilt:-4}}))});
// 13–16 — memory fragments: running in a dark hallway, holding a boy's hand; "don't leave me, Nawaf!"
S('s_mem',A(13),A(17),(l,t)=>{const w=E.walkPose(t,{run:1,period:.9});const k=ramp(t,A(13),A(17));
  E.pose(MEM.me,merge(w,{x:lerp(260,420,k),y:820-470*.5+w._bob*.5,s:.5,view:'side',armL:{sh:-70,el:-10}}));
  E.pose(MEM.boy,merge(E.walkPose(t+.2,{run:1,period:.9}),{x:lerp(140,300,k),y:820-470*.48,s:.48,view:'side',dark:.85,armR:{sh:-75,el:-10}}));
  $('#s_mem .glitch').setAttribute('opacity',glitchAt(t,A(14))+glitchAt(t,A(15)+.3)+glitchAt(t,A(16))*.6);
  $('#s_mem').style.transform=(Math.floor(t*8)%7===0)?`translateX(${Math.sin(t*90)*10}px)`:'';cam('s_mem',{s:1.2,x:lerp(-60,60,k),y:-60,shake:1.5})});
// 17–18 — back on the stairs, breathing fast, hand on his head
S('s_face',A(17),A(19),(l,t)=>{const [c,f]=faceScene('naw',{s:4.2,ache:1-ramp(t,A(18),A(18)+1)});pose(c,merge(f,{brows:'fear',eyes:{x:.8,y:.6,blink:blink(t,1)},mouth:{open:.25+.1*Math.sin(t*9)},head:{nod:Math.sin(t*6)}}))});
// 19–20 — "how old are you?" … "fifteen." (clear this time)
S('s_face',A(19),A(20),(l,t)=>{const [c,f]=faceScene('naw',{s:4.2});pose(c,merge(f,{brows:'doubt',eyes:{x:.8,y:.7},talk:talk(t,SPEAK.nawaf)}))});
S('s_stairs',A(20),A(21),(l,t)=>{stairs(t,{});cam('s_stairs',{s:1.9,x:200,y:560})});
// 21–25 — the phone buzzes: a file — "Salem's death report"; he opens it: a young man who looks nothing like me
S('s_phone',A(21),A(25),(l,t)=>{E.renderChat('p9',MSG.slice(0,3),t);$('#p9-doc').style.opacity=ramp(t,A(24),A(24)+.4);E.pcam('s_phone',lerp(1.1,1.3,ease(ramp(l,0,4))),0,lerp(0,-40,ease(ramp(l,0,4))),E.vib(t,A(21),.8));repLines(t)});
S('s_phone',A(25),A(29),(l,t)=>{E.renderChat('p9',MSG.slice(0,3),t);$('#p9-doc').style.opacity=1;repLines(t);
  const tgt=t<A(26)?[1.9,0,330]:(t<A(27)?[1.7,0,60]:[1.7,0,-10]);E.pcam('s_phone',tgt[0],tgt[1],tgt[2])});
// 29–31 — the impossible timeline (cards)
S('s_cmp',A(29),A(32),(l,t)=>{$('#cmp .c1').style.opacity=ramp(t,A(29),A(29)+.4);$('#cmp .c2').style.opacity=ramp(t,A(30),A(30)+.4);$('#cmp .c3').style.opacity=ramp(t,A(31),A(31)+.4)});
// 32 — he backs away up the stairs
S('s_stairs',A(32),A(33),(l,t)=>{const b=ease(ramp(t,A(32),A(32)+.8));stairs(t,{nx:lerp(120,90,b),ny:lerp(580,560,b),wide:.4});cam('s_stairs',{s:1.15,x:40,y:200})});
// 33–35 — Salem's second voice message: "I died three days before the fire!… the one below isn't me."
S('s_phone',A(33),A(36)+.4,(l,t)=>{$('#p9-doc').style.opacity=0;E.renderChat('p9',MSG.slice(0,4),t);E.pcam('s_phone',lerp(1.3,1.7,ease(ramp(t,A(33),A(34)))),0,lerp(0,-280,ease(ramp(t,A(33),A(34)))),Math.sin(t*35)*1.5)});
S('s_face',A(36)+.4,A(37),(l,t)=>{const [c,f]=faceScene('naw',{s:4.4,lit:.35});pose(c,merge(f,{brows:'fear',eyes:{y:.7,tremble:.8},mouth:'tense',phone:.5}))});
// 37–42 — laughter from below; the camera goes into the dark: "I'm not Salem… you left yourself."
S('s_face',A(37),A(38),(l,t)=>{const [c,f]=faceScene('naw',{s:4.2});const turn=ease(ramp(t,A(37)+.3,A(37)+.9));pose(c,merge(f,{brows:'shock',eyes:{x:lerp(0,1,turn),y:lerp(0,.8,turn),wide:.6},head:{turn:turn*.4}}))});
S('s_stairs',A(38),A(43),(l,t)=>{stairs(t,{shadow:.9});const k=ease(ramp(t,A(38),B(42)));cam('s_stairs',{s:lerp(1.3,2.4,k),x:lerp(150,210,k),y:lerp(400,610,k)})});
// 43–44 — he starts up: first his shadow on the wall
S('s_wall',A(43),A(45),(l,t)=>{const k=ease(ramp(t,A(43),A(45)));const st=Math.abs(Math.sin(t*3.2))*14;T($('#s_wall .wallSh'),`translate(${lerp(560,420,k)} ${lerp(1500,1240,k)-st}) scale(${lerp(1.6,1.25,k)})`);cam('s_wall',{s:1.05})});
// 45 — then his feet on the steps (knees bend, foot plants, weight shifts)
S('s_feet',A(45),A(46),(l,t)=>{feet(t);cam('s_feet',{s:1.0,y:-t*8%0})});
// 46 — then his hand on the rail
S('s_rail',A(46),A(47),(l,t)=>{const k=ease(ramp(l,0,1.6));T($('#s_rail .kh'),`translate(${lerp(120,420,k)} ${lerp(1010,795,k)}) rotate(-35)`);cam('s_rail',{s:1.05})});
// 47–48 — step… step… (feet again, slower, louder)
S('s_feet',A(47),A(49),(l,t)=>{feet(t,.8);cam('s_feet',{s:1.05})});
// 49–51 — he reaches the light; the camera tilts from his feet to his face
S('s_reveal',A(49),A(52),(l,t)=>{const k=ease(ramp(t,A(49),A(51)+.6));E.pose(RV,{x:360,y:1180-470*.6,s:.6,dark:lerp(.9,0,ramp(t,A(49),A(50)+.5)),eyes:{y:-.2},head:{nod:lerp(4,0,ramp(t,A(50),A(50)+.8))}});
  cam('s_reveal',{s:lerp(2.2,2.6,k),x:0,y:lerp(520,20,k)})});
// 52–53 — the boy… was me (him / me / him)
